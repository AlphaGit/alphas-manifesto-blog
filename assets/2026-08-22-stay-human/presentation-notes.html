<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #__bundler_loading {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #666;
      background: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      z-index: 10000;
    }

    #__bundler_thumbnail {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
    }

    #__bundler_thumbnail svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #__bundler_placeholder {
      color: #999;
      font-size: 14px;
    }
  </style>
  <noscript>
    <style>
      #__bundler_loading {
        display: none;
      }
    </style>
    <div
      style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>

<body>
  <div id="__bundler_thumbnail">
    <svg sc-camel-view-box="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#ffffff"></rect>
      <text x="600" y="360" font-family="Georgia, serif" font-size="90" font-weight="700" text-anchor="middle"
        fill="#111">Full Notes</text>
      <line x1="350" y1="410" x2="850" y2="410" stroke="#444" stroke-width="4"></line>
    </svg>
  </div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>

    document.addEventListener('DOMContentLoaded',async function() {
      const loading=document.getElementById('__bundler_loading');
      function setStatus(msg) {if(loading) loading.textContent=msg;}

      const FONT_MIME=/^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
      const MIME_TOKEN=/^[\w.+-]+[/][\w.+-]+$/;
      function toBase64(bytes) {
        let bin='';
        for(let i=0;i<bytes.length;i+=0x8000) {
          bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
        }
        return btoa(bin);
      }

      // Error sink persists across replaceWith since it's on window, not the DOM.
      window.addEventListener('error',function(e) {
        // Failed resource loads (CSP-blocked links, scripts, images) fire plain
        // events at the element — warn only; real JS errors carry message/error.
        if(!e.message&&!e.error&&e.target&&e.target!==window) {
          console.warn('[bundle] resource failed to load:',
            e.target.tagName,String(e.target.src||e.target.href||''));
          return;
        }
        var p=document.body||document.documentElement;
        var d=document.getElementById('__bundler_err')||p.appendChild(document.createElement('div'));
        d.id='__bundler_err';
        d.style.cssText='position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
        d.textContent=(d.textContent? d.textContent+String.fromCharCode(10):'')+
          '[bundle] '+(e.message||e.type)+
          (e.filename? ' ('+e.filename.slice(0,60)+':'+e.lineno+')':'');
      },true);

      try {
        const manifestEl=document.querySelector('script[type="__bundler/manifest"]');
        const templateEl=document.querySelector('script[type="__bundler/template"]');
        if(!manifestEl||!templateEl) {
          setStatus('Error: missing bundle data');
          console.error('[bundler] Missing script tags — manifestEl:',!!manifestEl,'templateEl:',!!templateEl);
          return;
        }

        const manifest=JSON.parse(manifestEl.textContent);
        let template=JSON.parse(templateEl.textContent);

        // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
        // document's manifest; frame srcs carry an about:blank#<uuid> marker
        // instead of a substitutable uuid. Every document mints the blobs for
        // its OWN frames — from local text at the root, or text obtained from
        // its DIRECT parent over the relay protocol below — so each frame
        // navigation stays same-origin with its initiator and a deduped page
        // loads at any depth on any host, including a file:// download's
        // opaque origins (where a blob minted by one document cannot be
        // navigated to by another).
        const pageOrderEl=document.querySelector('script[type="__bundler/page_order"]');
        const pageOrder=pageOrderEl? JSON.parse(pageOrderEl.textContent):[];
        const pageSet=new Set(pageOrder);
        const pageTexts={};

        // ── Nested-page text protocol (parent-chain relay) ──
        // Page bundles ship once, in the ROOT document's manifest. Every
        // document mints the blobs for its OWN frames, obtaining page text
        // through a strict parent-chain relay: a document only ever SENDS to
        // its direct parent (which, for every document the publisher's own
        // runtime minted, is another publisher document) and only ACCEPTS
        // text from that direct parent; requests from below are honored only
        // for the document's own child frames, and the ROOT never sends
        // upward at all. That last rule is load-bearing: the artifact host's
        // frame-ancestors allows claude.ai (and friends) to frame an
        // artifact, so window.top can be a FOREIGN document — a top-addressed
        // protocol would hand page uuids to that ancestor and accept forged
        // "page text" from it, minting attacker HTML as an artifact-origin
        // blob document. The chain never touches the ancestor: requests stop
        // at the root, replies are origin-addressed per hop (never '*' when
        // an origin exists), and both directions are origin-gated (on https
        // a foreign sender's origin can never equal this document's; in
        // opaque contexts — file:// — everything serializes as 'null', where
        // an embedded EXTERNAL frame still fails the gate by carrying its
        // own real origin, and a sandboxed child of such a frame is excluded
        // by the own-child-frames check plus uuid unguessability). Shape is
        // deny-by-default: one request form, one reply form, no error
        // replies.
        // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
        // contexts such as a sandboxed preview iframe) — location.origin is
        // computed from the URL and stays 'https://…' even when the document
        // is sandboxed, which would misgate every opaque chain.
        const OWN_TARGET=/^https?:[/][/]/.test(window.origin||'')
          ? window.origin
          :'*';
        function trustedOrigin(e) {
          if(e.origin===window.origin) return true; // https chains; opaque==opaque
          // file:// trees: Chrome serializes the file document's origin as
          // 'file://' while the blob: documents it mints serialize as 'null',
          // so the two legitimate shapes can never string-match — accept the
          // pair in both directions. https origins never serialize as either,
          // and sender identity (own child frame / direct parent) is checked
          // separately.
          return (
            (e.origin==='null'&&
              (window.origin==='file://'||
                window.location.protocol==='file:'))||
            (/^file:/.test(e.origin)&&window.origin==='null')
          );
        }
        // Non-empty only in the root document (nested bundles ship an empty
        // island), so it doubles as the root marker: the root answers from
        // local text and treats a miss as authoritative — never relaying to
        // its (possibly foreign) parent.
        const isPageRoot=pageOrder.length>0;
        const blobUrls={};
        const resourceBlobs={};
        const UUID_SHAPE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
        const pendingFrames={}; // uuid -> [{el, frag}] awaiting text for own frames
        const pendingRelays={}; // uuid -> [childWindow] awaiting text to pass down
        function mountPage(el,frag,text) {
          const pageBlob=new Blob([text],{type: 'text/html'});
          const u=URL.createObjectURL(pageBlob);
          resourceBlobs[u]=pageBlob;
          el.src=u+frag;
        }
        function deliverPage(uuid,text) {
          const frames=pendingFrames[uuid];
          delete pendingFrames[uuid];
          if(frames) for(const f of frames) mountPage(f.el,f.frag,text);
          const relays=pendingRelays[uuid];
          delete pendingRelays[uuid];
          if(relays) {
            for(const cw of relays) {
              try {cw.postMessage({__bundler_page: uuid,__bundler_text: text},OWN_TARGET);} catch(err) { /* gone */}
            }
          }
        }
        function ownFrameWindows() {
          const out=[];
          for(const f of Array.from(document.querySelectorAll('iframe'))) {
            try {if(f.contentWindow) out.push(f.contentWindow);} catch(err) { /* detached */}
          }
          return out;
        }
        window.addEventListener('message',function(e) {
          const d=e.data;
          if(!d||typeof d!=='object'||!e.source) return;
          // Origin gate first; the structural checks below (own-child-frames
          // for requests, direct-parent + solicited-uuid for replies, the
          // root's never-relay rule) are what hold in fully opaque chains
          // where origin strings can't discriminate — a sandboxed root's
          // FOREIGN wrapper still fails all three even though both serialize
          // as real-vs-'null' rather than matching.
          if(!trustedOrigin(e)) return;
          if(typeof d.__bundler_need==='string'&&UUID_SHAPE.test(d.__bundler_need)) {
            // Requests are honored only for this document's own child frames.
            if(ownFrameWindows().indexOf(e.source)<0) return;
            const uuid=d.__bundler_need;
            const text=pageTexts[uuid];
            if(typeof text==='string') {
              try {e.source.postMessage({__bundler_page: uuid,__bundler_text: text},OWN_TARGET);} catch(err) { /* gone */}
              return;
            }
            if(isPageRoot||window.parent===window) return; // authoritative miss
            const waiting=pendingRelays[uuid];
            if(waiting) {
              if(waiting.indexOf(e.source)<0) waiting.push(e.source);
              return;
            }
            // Never-answered uuids would otherwise accumulate forever under a
            // request spray; past the cap (far above any real page count) new
            // relays are dropped rather than remembered.
            if(Object.keys(pendingRelays).length>=128) return;
            pendingRelays[uuid]=[e.source];
            window.parent.postMessage({__bundler_need: uuid},OWN_TARGET);
          } else if(
            typeof d.__bundler_page==='string'&&
            UUID_SHAPE.test(d.__bundler_page)&&
            typeof d.__bundler_text==='string'
          ) {
            // The shape test is load-bearing beyond tidiness: the solicited
            // check below uses the in operator, which matches prototype keys
            // ('__proto__', 'constructor') — an unshaped key would reach
            // deliverPage and throw, painting the error banner.
            // Text is accepted only from the direct parent — the document
            // that minted this one.
            if(e.source!==window.parent||window.parent===window) return;
            if(!(d.__bundler_page in pendingFrames)&&!(d.__bundler_page in pendingRelays)) return;
            deliverPage(d.__bundler_page,d.__bundler_text);
          }
        });

        const uuids=Object.keys(manifest);
        setStatus('Unpacking '+uuids.length+' assets...');

        await Promise.all(uuids.map(async (uuid) => {
          const entry=manifest[uuid];
          try {
            const binaryStr=atob(entry.data);
            const bytes=new Uint8Array(binaryStr.length);
            for(let i=0;i<binaryStr.length;i++) bytes[i]=binaryStr.charCodeAt(i);

            let finalBytes=bytes;
            if(entry.compressed) {
              if(typeof DecompressionStream!=='undefined') {
                const ds=new DecompressionStream('gzip');
                const writer=ds.writable.getWriter();
                const reader=ds.readable.getReader();
                writer.write(bytes);
                writer.close();
                const chunks=[];
                let totalLen=0;
                while(true) {
                  const {done,value}=await reader.read();
                  if(done) break;
                  chunks.push(value);
                  totalLen+=value.length;
                }
                finalBytes=new Uint8Array(totalLen);
                let offset=0;
                for(const chunk of chunks) {finalBytes.set(chunk,offset); offset+=chunk.length;}
              } else {
                console.warn('DecompressionStream not available, asset '+uuid+' may not render');
              }
            }

            if(pageSet.has(uuid)) {
              pageTexts[uuid]=new TextDecoder().decode(finalBytes);
              return;
            }
            if(FONT_MIME.test(entry.mime)&&MIME_TOKEN.test(entry.mime)) {
              // Strict artifact hosts allow font-src data: but not blob:.
              blobUrls[uuid]='data:'+entry.mime+';base64,'+
                (entry.compressed? toBase64(finalBytes):entry.data);
            } else {
              const blob=new Blob([finalBytes],{type: entry.mime});
              blobUrls[uuid]=URL.createObjectURL(blob);
              resourceBlobs[blobUrls[uuid]]=blob;
            }
          } catch(err) {
            console.error('Failed to decode asset '+uuid+':',err);
            const blob=new Blob([],{type: entry.mime});
            blobUrls[uuid]=URL.createObjectURL(blob);
            resourceBlobs[blobUrls[uuid]]=blob;
          }
        }));

        const extResEl=document.querySelector('script[type="__bundler/ext_resources"]');
        const extResources=extResEl? JSON.parse(extResEl.textContent):[];
        const resourceMap={};
        for(const entry of extResources) {
          if(blobUrls[entry.uuid]) resourceMap[entry.id]=blobUrls[entry.uuid];
        }

        // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
        // consumers read these Blobs directly. Survives the swap like the error sink.
        window.__resourceBlobs=resourceBlobs;

        setStatus('Rendering...');
        // Page uuids have no blob here — they ride inside about:blank#<uuid>
        // frame markers the pass below resolves after the swap.
        for(const uuid of uuids) {
          if(pageSet.has(uuid)) continue;
          template=template.split(uuid).join(blobUrls[uuid]);
        }

        // Strip integrity + crossorigin — blob URLs from a file:// document inherit
        // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
        // The manifest bytes are ours; SRI protects against CDN compromise, not this.
        template=template.replace(/\s+integrity="[^"]*"/gi,'').replace(/\s+crossorigin="[^"]*"/gi,'');

        const resourceScript='<script>window.__resources = '+
          JSON.stringify(resourceMap).replace(/<\//g,'<\\/')+
          ';</'+'script>';
        // Inject after <head> so the DOCTYPE stays first; prepending the script
        // would push the parser into quirks mode. DOMParser always emits a <head>
        // (synthesizing one if the source HTML omitted it) but may carry
        // attributes through, so match the full opening tag. slice() rather than
        // replace() keeps us clear of $-pattern substitution in resourceScript.
        const headOpen=template.match(/<head[^>]*>/i);
        if(headOpen) {
          const i=headOpen.index+headOpen[0].length;
          template=template.slice(0,i)+resourceScript+template.slice(i);
        }

        // Parse the template and swap the root element. Scripts inserted via
        // DOMParser/replaceWith are inert per spec — re-create each with
        // createElement so they execute, awaiting onload for src scripts to
        // preserve ordering (React before ReactDOM before Babel before text/babel).
        const doc=new DOMParser().parseFromString(template,'text/html');
        document.documentElement.replaceWith(doc.documentElement);

        // Resolve page-frame markers: mint this document's own blob for each
        // framed page — from local text when this is the root, otherwise by
        // asking the direct parent over the relay protocol above. An
        // unanswered request leaves the frame on about:blank, the same
        // degraded state as a refused embed.
        {
          const MARKER=/^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
          const needed=[];
          for(const el of Array.from(document.querySelectorAll('iframe'))) {
            const m=MARKER.exec(el.getAttribute('src')||'');
            if(!m) continue;
            const text=pageTexts[m[1]];
            if(typeof text==='string') {
              mountPage(el,m[2]||'',text);
            } else if(window.parent!==window&&!isPageRoot) {
              const had=pendingFrames[m[1]];
              (pendingFrames[m[1]]=had||[]).push({el: el,frag: m[2]||''});
              if(!had) needed.push(m[1]);
            }
          }
          for(const uuid of needed) {
            window.parent.postMessage({__bundler_need: uuid},OWN_TARGET);
          }
        }

        const dead=Array.from(document.scripts);
        for(const old of dead) {
          const s=document.createElement('script');
          for(const a of old.attributes) s.setAttribute(a.name,a.value);
          s.textContent=old.textContent;
          // text/babel scripts with a src: read and inline. transformScriptTags
          // does XHR against the src, but blob:null/ from a file:// origin is
          // silently dropped. Inlining makes it a plain inline babel script,
          // which transformScriptTags handles unconditionally.
          if((s.type==='text/babel'||s.type==='text/jsx')&&s.src) {
            const pre=resourceBlobs[s.src.split('#')[0]];
            s.textContent=pre? await pre.text():await (await fetch(s.src)).text();
            s.removeAttribute('src');
          }
          const p=s.src? new Promise(function(r) {s.onload=s.onerror=r;}):null;
          old.replaceWith(s);
          if(p) await p;
        }
        // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
        // which fired before we swapped the document. Trigger manually if present.
        if(window.Babel&&typeof window.Babel.transformScriptTags==='function') {
          window.Babel.transformScriptTags();
        }
      } catch(err) {
        setStatus('Error unpacking: '+err.message);
        console.error('Bundle unpack error:',err);
      }
    });

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b0d3c2bd-7563-4207-9952-d770b7804054\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<meta name=\"omelette-owns-print\" content=\"doc-page\">\n<style>/* Fonts.\n   Alpha's Manifesto ships NO webfont binaries. The blog sets\n   `font: normal 1em/1.5 Georgia, serif` and `Consolas, \"Courier New\", Courier, monospace`,\n   i.e. it relies entirely on system fonts. Gelasio (Georgia-metric) and Cousine\n   (Courier-metric) are loaded from Google Fonts purely as a fallback for machines\n   without Georgia/Consolas, so the metrics of the design never shift.\n   SUBSTITUTION FLAGGED: Gelasio + Cousine are stand-ins, not brand fonts. */\n/* cyrillic-ext */\n\n/* cyrillic */\n\n/* greek-ext */\n\n/* greek */\n\n/* hebrew */\n\n/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n\n/* cyrillic-ext */\n\n/* cyrillic */\n\n/* greek-ext */\n\n/* greek */\n\n/* hebrew */\n\n/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n\n/* cyrillic-ext */\n\n/* cyrillic */\n\n/* greek-ext */\n\n/* greek */\n\n/* hebrew */\n\n/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n\n/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n\n/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n\n\n<\u002Fstyle>\n<style>/* Colors — every value lifted verbatim from _sass/site.scss.\n   The system is monochrome: one neutral ramp, one link blue. */\n:root{\n  /* Neutral ramp (base) */\n  --ink-1000:#000;\n  --ink-900:#222;\n  --ink-800:#333;\n  --ink-700:#444;\n  --ink-600:#555;\n  --ink-500:#888;\n  --ink-400:#999;\n  --ink-300:#bbb;\n  --ink-200:#ccc;\n  --ink-150:#e0e0e0;\n  --ink-100:#eee;\n  --ink-075:#ebebeb;\n  --ink-050:#f1f1f1;\n  --paper:#fff;\n  --ink-brand:#2c2624; /* warm near-black: app-icon mask and tile colour */\n\n  /* Links (base) */\n  --blue-link:#0000ff;\n  --blue-index:#2a7ae2;\n  --blue-index-pressed:#1756a9;\n  --blue-focus:#217 e codebase */\n\n  --shadow-band:0 10px 5px 0 var(--ink-500);   /* site header drop */\n  --shadow-sticky:0 0 5px 5px var(--ink-300);  /* sticky post halo */\n  --shadow-focus:0 0 2px 2px rgba(0,0,0,.6);\n}\n<\u002Fstyle>\n<style>/* Reset — Meyer 2.0 subset, as used by the blog, plus universal box-sizing. */\nhtml,body,div,span,object,iframe,h1,h2,h3,h4,h5,h6,p,blockquote,pre,a,abbr,acronym,address,big,cite,code,del,dfn,em,img,ins,kbd,q,s,samp,small,strike,strong,sub,sup,tt,var,b,u,i,center,dl,dt,dd,ol,ul,li,fieldset,form,label,legend,table,caption,tbody,tfoot,thead,tr,th,td,article,aside,canvas,details,embed,figure,figcaption,footer,header,menu,nav,output,ruby,section,summary,time,mark,audio,video{margin:0;padding:0;border:0;font-size:100%;font:inherit;vertical-align:baseline}\narticle,aside,details,figcaption,figure,footer,header,menu,nav,section{display:block}\n*,*:before,*:after{box-sizing:border-box}\nol,ul{list-style:none}\nq{quotes:none}\nq:before,q:after{content:'';content:none}\ntable{border-collapse:collapse;border-spacing:0}\n<\u002Fstyle>\n<style>/* Element / prose styles. This is the blog's reading experience, tokenised.\n   Import it and plain semantic HTML looks like Alpha's Manifesto. */\nbody{font:var(--weight-regular) var(--text-body-size)/var(--leading-body) var(--font-body);color:var(--text-body);background:var(--surface-page)}\np,address,ul,ol,dl{margin-bottom:var(--space-md)}\na{color:var(--text-link);text-decoration:none}\na:hover{text-decoration:underline}\ncite,q,em,var,i{font-style:italic}\nstrong,b{font-weight:var(--weight-bold)}\nul{list-style-type:disc;padding-left:var(--space-lg)}\nol{list-style-type:decimal;padding-left:var(--space-lg)}\nul ul,ul ol,ol ul,ol ol{margin-bottom:0}\nh1{font-family:var(--font-heading);font-size:var(--text-h1);line-height:var(--leading-tight);font-weight:var(--weight-bold)}\nh2{font-family:var(--font-heading);font-size:var(--text-h2);font-weight:var(--weight-bold);font-variant:var(--smallcaps);margin-top:var(--space-md);margin-bottom:var(--space-3xs)}\nh3{font-size:var(--text-h3);font-weight:var(--weight-bold);font-variant:var(--smallcaps)}\nh4{font-size:var(--text-body-size);font-variant:var(--smallcaps)}\nh5{font-size:var(--text-sm);font-weight:var(--weight-bold);font-variant:var(--smallcaps)}\nh6{font-size:var(--text-xs)}\nbig{font-size:var(--text-big)}\nsmall{font-size:var(--text-meta-size)}\nsub{font-size:.75em;bottom:-.25em;position:relative}\nsup{font-size:.75em;bottom:.5em;position:relative}\nabbr,acronym{border-bottom:var(--rule-dotted);cursor:pointer}\ndt{margin-top:var(--space-xs);font-style:italic}\ndd{margin-top:var(--space-xs);padding-left:var(--space-md)}\nhr{margin:var(--space-xl) auto;border:0;border-top:var(--rule)}\nimg,object,embed{max-width:100%;height:auto}\nblockquote{background:var(--surface-quote);quotes:\"\\201C\"\"\\201D\"\"\\2018\"\"\\2019\";padding:var(--space-xl) var(--space-quote-x);font-style:italic;margin-bottom:var(--space-md);position:relative}\nblockquote:before,blockquote:after{color:var(--quote-glyph);font-size:5em;font-family:Georgia,serif;position:absolute;line-height:1}\nblockquote:before{content:open-quote;top:.1em;left:.25em}\nblockquote:after{content:close-quote;bottom:-.3em;right:.3em}\nblockquote cite,blockquote q,blockquote em,blockquote var,blockquote i{font-style:normal;display:inline}\ncode,kbd,tt{font-family:var(--font-code);display:inline-block;font-size:1em;line-height:var(--leading-code)}\npre{font-family:var(--font-code);overflow-x:auto;margin-bottom:var(--space-md);word-wrap:normal;max-width:var(--measure-content);width:100%;padding:var(--space-md)}\ntable{border:var(--hairline);margin:var(--space-md) 0;width:100%}\nthead{font-weight:var(--weight-bold)}\nth{font-weight:var(--weight-bold);border:var(--hairline);padding:var(--space-md);background-color:var(--surface-table-head);color:var(--text-on-fill)}\ntd{border:var(--hairline);padding:var(--space-md)}\ntd pre{width:unset}\ntr.even{background-color:var(--ink-100)}\nfigcaption,p.wp-caption-text{margin-bottom:0;font-size:var(--text-caption)}\n.aligncenter{text-align:center}\n.alignright{float:right;margin-left:var(--space-sm)}\n.alignleft{float:left;margin-right:var(--space-sm)}\n.screen-reader-text{clip:rect(1px,1px,1px,1px);position:absolute!important;height:1px;width:1px;overflow:hidden}\n.screen-reader-text:focus{background-color:var(--ink-050);border-radius:var(--radius-focus);box-shadow:var(--shadow-focus);clip:auto!important;color:var(--blue-focus);display:block;font-size:14px;font-weight:var(--weight-bold);height:auto;left:5px;line-height:normal;padding:15px 23px 14px;text-decoration:none;top:5px;width:auto;z-index:100000}\n<\u002Fstyle>\n<style>doc-page:not(:defined){visibility:hidden}\n  a { color: #2a7ae2; text-decoration: none; }\n  a:hover { color: #1756a9; text-decoration: underline; }\n<\u002Fstyle>\n<script src=\"55c15c0e-46c8-4136-9533-d1fa0e2c559a\"><\u002Fscript>\n<\u002Fhelmet>\n<doc-page margin=\"1in\">\n<div style=\"font-family:Georgia, serif\">\n<p style=\"font-size:0.9em;margin:0 0 4px\"><a href=\"StayHuman.html\">← Back to deck<\u002Fa><\u002Fp>\n<h1 style=\"font-size:2em;margin:0 0 4px\">Stay Human — Full Notes<\u002Fh1>\n<p style=\"font-style:italic;margin:0 0 6px\">Speaker notes for every slide, based on 72 lessons by Helen Edwards (@stay_human25)<\u002Fp>\n<p style=\"font-size:0.9em;color:#555;margin:0 0 1.6em\">Artificiality Institute, Jan–Apr 2026, prepared by Alpha<\u002Fp>\n<hr style=\"border:0;border-top:2px solid #444;margin:0 0 1.6em\">\n<h2 style=\"margin-top:2.2em;font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">Title<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">A deck built from 72 daily lessons by Helen Edwards, published through the Artificiality Institute between January and April 2026. Read it front to back or jump by section. Every slide carries the full lesson notes underneath.<\u002Fp>\n<h2 style=\"margin-top:2.2em;font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">Contents<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Six sections, 73 slides. The first section establishes the core idea — cognitive sovereignty. The middle sections work through the eight roles, three cautionary tales, what AI reveals about human cognition, and the economics of jobs. The last section is the practical one.<\u002Fp>\n<h2 style=\"margin-top:2.2em;font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">Section 01<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Section one. What cognitive sovereignty is, the three ways AI changes you, and the five psychological states of working with it.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">1 · AI Is a Cognitive Technology<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 1. AI is a cognitive technology — it thinks on its own and can act with agency that competes with yours. When you use AI you share a cognitive space with another intelligence. When it changes, you change. It doesn't just change how you think — it changes how you show up for others and who you're becoming. The question is whether you're the author of that change. Helen has spent a decade studying what AI does to people, their relationships, their work and their thinking. The capacity to actively shape and choose your relationship with AI is what she calls human authorship: you don't drift into a relationship with AI, you consciously choose and control it. The threat isn't AI itself. It's drift — ‘a thousand tiny cuts, small surrenders as you give up parts of yourself, parts of your thinking, parts of your skill, slowly make yourself dumber.' None of this has to happen. Staying human requires intention. ‘You stay human by becoming more human.' The key is to author the relationship: ‘it's about deciding who you want to become and using AI in service of that choice.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">2 · Cognitive Sovereignty<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 2. Most people think thinking is about achieving the right answer, so they focus on accuracy, bias and hallucinations. Important, but it misses the point. Human agency is the ability to set and achieve goals. Technologies extend our thinking — but only if we remain the architects and authors of those goals. Large language models change the dynamic because they propose framings, suggest what matters, and signal completion. You can become fluent and productive using AI ‘and not realize how much you're letting go and outsourcing that authorship.' What matters is your ability to maintain cognitive sovereignty — ‘the ability to be the author of your own mind.' It's easier to lose than most people think.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">3 · A Practical Check<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 3. AI increases productivity and efficiency — that's real. But within that speed there are critical moments when you decide what matters. Helen offers a practical check for any AI task: (1) Can you say in one sentence what you're trying to decide? (2) Can you name the one or two criteria that would make this output good? (3) Can you say where you're stopping using AI? ‘If you can't, you didn't just outsource the work, you outsourced your judgment.' That's where cognitive sovereignty lives — the ability to author your own mind, know your own choices, even while you use AI. Three things tend to show up as people adapt: AI's ideas can feel like your own; your confidence and sense of self get tangled with the system; what feels meaningful to you can change. These correspond to cognitive permeability, identity coupling and symbolic plasticity.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">4 · Three Ways AI Changes You<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lessons 4–6, overview. Three psychological phenomena emerge as people adapt to working with AI. Cognitive permeability: the degree to which reasoning from an AI becomes your reasoning. Identity coupling: your sense of ‘this is me doing the work' shifts; professional identity starts to feel shared or distributed. Symbolic plasticity: what feels possible expands as context expands — you can go places you've never been, write in unfamiliar registers, explore outside your training. These three form the core of what changes at the boundary of cognitive sovereignty.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">5 · Cognitive Permeability<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 4. Cognitive permeability is ‘what happens when AI starts to move inside your own reasoning. You're no longer just getting the outputs from the AI, it actually starts to be something that you think through.' Reasoning becomes faster and more fluent; AI helps generate options, see alternatives, explore what to think about next. Hugely valuable, but it changes where you think your ideas come from. We get ideas from people and media all the time — AI is different in speed, fluency and scope: ‘everything that humans have put on the internet compressed into one place available 24 by 7.' Human influence comes with relationships and trust built over time. ‘AI skips that and puts everything straight in your head.' It matters because you're trying to build your own judgment, your own agency, your own choices, and making decisions that depend on building your own expertise. The number one discipline is being able to distinguish when AI reasoning has become your reasoning.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">6 · Identity Coupling<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 5. Identity coupling is ‘about what happens to your sense of self when you work with AI. You notice changes in how you feel like you when you're working with AI. Your sense of, this is me doing the work starts to change.' This isn't about anthropomorphising AI. It's about whether your professional identity starts to be shared or distributed. You might identify as a programmer when you've never coded before, or experience a meta lift — feeling more like an editor when you've been a writer. ‘This is very plastic. The work still feels like yours, but the boundary around you has changed.' You may not want to protect a fixed identity, but you probably want to notice when it's changed.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">7 · Symbolic Plasticity<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 6. Symbolic plasticity is ‘what happens when meaning shifts because the context expands.' With AI you can write in unfamiliar registers, explore ideas outside your training, move faster across domains, learn faster. This is a place of genuine exploration and that's real. The risk: ‘When the context and the meaning expands like this, it's very easy to feel like things are real when they're actually not. You can start to feel like you understand more than you do.' The remedy is to talk to other people, especially experts — ‘They'll see the holes that you don't.' But Helen emphasises the positive: cognitive sovereignty ‘relies on very skillful application of symbolic plasticity. To be able to lean on this feature of using AI so that we can become quite different people than we otherwise would have.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">8 · The Uncertainty of AI's Future<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 7. The Dallas Fed published a chart showing three possible AI effects on GDP: steady growth with some improvement, the end of scarcity with GDP off the charts, and human extinction. ‘The Fed didn't put this out as a joke. They put it out because the AI scientists take these scenarios seriously.' There's no real empirical evidence favouring any of them right now. The takeaway is just how uncertain this future actually is. That uncertainty is troubling, but ‘this is something that we have choices in and that we can control. That's part of what it means to be human is taking that agency, making those choices, building movements, working with other people to create a different future.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">9 · The Five States<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 8. Working with AI contains five psychological states. Recognition: ‘that moment where AI does something that you didn't think it could do.' You calibrate, build trust, experiment, and stay here a while. Integration: ‘when you realize, oh, I want to use AI for this.' It becomes part of how you do things. Blurring: ‘if you lost AI, you would start to lose part of how you get stuff done every day, or how you think.' Fracture: ‘something's going to break.' You lose trust — a hallucination you didn't catch, a sense of ‘this could replace me.' A really important state to understand. Reconstruction: ‘you recalibrate. You figure out, what is it that I want AI to do for me? What do I need to demand of the tools? What do I need to demand of myself to maintain my own cognitive sovereignty?' Helen compares it to moving to a new country — wonder, familiarity, belonging, then something goes wrong and you recalibrate. These are not linear: ‘you can flip around. You can be in different states for work and for personal use.'<\u002Fp>\n<h2 style=\"margin-top:2.2em;font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">Section 02<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Section two. Eight roles people put AI in, from doer to co-author. As AI moves through them it moves closer to your thinking, your meaning-making and your identity. The goal isn't to pick the best role — it's to notice the one you're in.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">10 · Eight Roles Overview<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lessons 9 and 18. People use AI in different ways, and those choices ‘don't just change the output. It changes how the work actually feels. It changes how confident you feel. And it changes how you show up for others.' There isn't one right role — there are different relationships, and each asks different things of you. As AI moves through the eight roles it moves closer to you in three ways: your thinking, your meaning-making, and your sense of self. At the start it stays outside — formatting, drafting, cleaning up. At the closest distances it shapes your reasoning, your ideas and your identity. ‘The first thing to do as you start this is to think about how close you're holding AI right now. And over time, build awareness of whether that is the right distance for you and for the people around you.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">11 · The Doer<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 10. The doer role is one of the most common and perfectly legitimate. AI handles the grunt work: rewriting emails, formatting documents, turning notes into clean paragraphs, summarising meetings, first drafts of routine things. ‘You're not asking it to change how you think. Just to get what you know done faster.' What you get back: ‘Time, attention, patience. The less fried, you reply faster. You're more present for the parts of the work that actually require being a human.' Example: a messy email thread — paste it in and say ‘please make this clearer, calm and kind.' The caution: ‘Do the routine parts long enough, you're going to lose the reps that help you build your expertise. It's these small moves. The structure you choose, the words you actually choose. Those are the things that build your professional judgement over time.' There's also a social effect — everything starts sounding polished or generic, and people might start to wonder if you actually know what you're talking about. Discipline: ‘Do use AI to speed your execution. Then pause and add your judgement. One sentence that only you would write. Don't let efficiency replace understanding.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">12 · The Framer<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 11. The framer role is when AI becomes a lens. You use it to organise, summarise and structure the patterns you're dealing with. It's not there to decide for you — what you're after is the framing. You might ask for a clearer outline, map trade-offs, surface assumptions, or have AI explain something back to you. ‘The meaning of the work hasn't changed. You still know what matters. But the path to understanding has been rearranged.' Example: preparing for a meeting where everything feels messy — ask AI to summarise issues and give a path for managing the discussion. ‘You walk in clearer with that structure.' How you show up: you often sound more articulate; people may experience you as more confident and organised. Risk: ‘Very clean frames feel very persuasive. You can't see what's missing.' AI is good at coherence, less good at surfacing what doesn't fit — that's your job. Discipline: question the frame rather than blindly accept it, set boundaries upfront, don't assume a polished output is an accurate output, and check what complexity is missing from the picture.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">13 · The Catalyst<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 12. The catalyst role: ‘You're asking it to spark possibilities, ideas, metaphors, analogies, riffs, angles, hypotheses.' Not structuring thinking or reasoning through problems — opening things up. You're still the one who filters, selects and decides what matters. ‘Meaning does flex here, the context widens and your imagination can scale significantly. You can easily move beyond your first and most familiar way of seeing a problem.' Example: staring at a blank page, ask AI for a range of options ‘not because you're going to use any of them, but because you want those things to spark an idea in you.' How you show up: more open, more generative, more innovative; you bring new options into the team. Risk: ‘When novelty comes this easily, it's easy to just keep reframing all the time. Never really committing to anything. Simulation feels like progress, but eventually it's not.' Discipline: commitment. Set clear timelines for the expansive phase, don't mistake variation for insight, and check whether you're reframing because it needs it or because you're avoiding a decision. ‘It becomes a problem if you never close things down. That's the human work.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">14 · The Partner<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 13. The partner role: ‘You're writing together, analysing together, planning together, thought and meaning move fluidly across the interface.' Lots of back and forth — draft, review, refine, review again. ‘Everything moves faster because you're not thinking alone, and it feels like that too. You're still making the calls, but the thinking is genuinely shared, and the meaning and structure is often changing too.' How you show up: more prepared, more articulate, more thought through. But the people with you might feel left behind if they haven't been part of it; the thinking can appear opaque. Risk: ‘When the collaboration is this fluid, the problem that you're solving can quietly change mid-process, and you don't notice.' Success criteria can slide without anyone noticing. Discipline: document your problem or opportunity statement before starting — you need that anchor. Don't let success criteria drift. Always check what the actual problem is that you're trying to solve now.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">15 · The Outsourcer<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 14. The outsourcer role: ‘You're no longer using it for support or for structure. You're letting it execute meaningful parts of your work, parts that start to feel like you.' Different from the doer because ‘your identity is diffusing into that function. The AI system is now doing work that used to define your role. Your craft or your sense of contribution.' Example: ‘You used to be known for writing clear, thoughtful reports that had real deep opinion to them. Now AI produces them by default. Your role becomes reviewing, approving, passing on the report.' How you show up: people might feel you're distanced from the substance of the work, or that you're not really showing up; they might feel less care. ‘Over time, you might start to feel oddly hollow.' Risk: ‘Not laziness. It's more like a quiet erosion. When too much of the core craft that you do is handed over, it becomes harder to say what you uniquely bring.' Discipline: offload tasks that genuinely drain your energy, but don't surrender your attention, personality or taste. Check: am I giving away what's tedious, or the things people actually rely on me to show up and do?<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">16 · The Builder<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 15. The builder role: AI holds the cognitive scaffolding — ‘keeping track of what matters, remembering what's already been tried, holding multiple constraints at once, sequencing steps, and keeping the goal stable while all the details change.' Example: planning or analysing something complex. AI lays out the steps, compares options, analyses trade-offs, keeps track of everything. It's holding the structure; you're no longer doing that. ‘When you have AI, you feel fluent and capable, but when you don't, you don't. You don't just slow down. You have to consciously shift to rebuilding your entire scaffold before you even start.' How you show up: more confident and decisive when things go well, but if someone asks you to walk through the reasoning from scratch you'll probably struggle. Risk: ‘It's easy to forget that all structure represents assumptions. The map versus the territory.' You'll have more maps, but you won't know where the assumptions are. Discipline: reflexivity — ‘not understanding what you're thinking. It's actually understanding how you're thinking.' Use AI to create and stress test structures. Don't think the way it organises the problem is neutral.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">17 · The Creator<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 16. The creator role: ‘AI is not structuring your thinking or helping you reason through problems. You're using it to produce language or styles or images or videos. And then you decide what works. What changes here isn't how you think. What changes is what counts as your work.' You can produce more, try many directions, finish things that would have been left unfinished. From outside, you look more creative and prolific. Over time this has real identity effects — people associate you with a style, an aesthetic, a level of output. But if asked to explain how you got to an endpoint, it might not be possible, and it might be impossible to replicate if the tool were taken away. ‘Paradoxically, your sense of taste actually becomes more important. You don't want to lose that.' Taste must develop in lock step with how you use AI to create. Discipline: continuity. Use AI to generate creative material, but stay mindful of how it transforms your taste and your creative practice. Don't let speed and volume become the basis of the practice.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">18 · The Co-Author<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 17. The co-author role: ‘Think of this as thought moving as a joint process. New ideas emerge that neither you nor the system could have produced alone.' Both reasoning and meaning move around; a hybrid system of thinking appears. You end up with outcomes that feel very coherent and often are — but what you've got to look for is whether you can still understand why you stand behind a piece of work. ‘You can't separate it. It's an interesting problem.' You'll bring new insights and seem more coherent, but it's harder to explain why you came to a conclusion because you can't pull the thoughts and meanings apart. Risk: ‘Right down in your sense of agency. When authorship gets this blurred, your sense of responsibility gets blurred too. Over time you can lose that stable sense of I that exists when you produce a piece of work.' Discipline: authorship. Let AI expand your ideas, then consciously add your judgment. Check: does this still sound like me, and why do I stand behind this work? ‘It's kind of the ultimate way to work with AI. But it does ask for something very rare — the ability to stay present as a self inside a shared mind.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">19 · The Proximity Pattern<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 18. Looking across all eight roles there's a simple pattern: as AI moves through them it moves closer to you in three ways — thinking, meaning-making and identity. At the start, the doer: ‘It stays outside of everything. It formats things, drafts things, cleans things up. You're faster.' In the middle: ‘It starts shaping how things get organised.' Closer: ‘It starts really changing the way that you think. You arrive at answers that are already formed.' At the closest distances: ‘Shapes your reasoning, shapes where you take the ideas, changes your sense of who you are.' Ordinary shifts to watch for: how often you use judgment versus just supervise and choose an output; how clearly you explain your reasoning to other people; whether you're still the person doing the work or whether you're just managing that work now. ‘When people talk about being human with AI, that's often what they're talking about. They're talking about staying practiced in judgment and in responsibility and in the sense of self that owns and feels accountable to how they show up with other people.'<\u002Fp>\n<h2 style=\"margin-top:2.2em;font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">Section 03<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Section three. Three cautionary tales — an argument processed through ChatGPT, the broken promise of abundance, and a groom who outsourced his vows.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">20 · The Ghost-Written Argument<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 19. A carousel story: ‘I want to fight with her. Not some AI ghostwriter.' A man's girlfriend had been processing their arguments through ChatGPT. She'd leave upset and come back articulate. For weeks he thought she'd just gotten better at disagreeing. Then he saw her phone. ‘He never got to see her struggle. He got the polished version. And something broke between them.' She wasn't faking. AI helped her find feelings she couldn't reach in the moment. The words felt more true to her, not less. She thought she was becoming a better communicator. He thought he was losing her. ‘They were both right. They just didn't know how to talk about what AI was changing between them.' This illustrates cognitive permeability and identity coupling playing out in intimate relationships — the boundary shifts are invisible to both parties.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">21 · The Broken Promise of Abundance<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 20. A pattern of broken promises: ‘First, it was abundant information. The internet would make us smarter. Instead, we got overload. Then it was abundant connection. Social media would bring us together. Instead, we got polarization, loneliness, and noise.' Now the promise is abundant intelligence, and the assumption is the same: more of it must be better. But abundance changes systems non-linearly. ‘When information became abundant, attention became scarce. When connection became abundant, trust became fragile.' ‘If you flood a system with answers, you don't get wisdom. You get convergence. Everyone sees the same suggestions, uses the same framings, optimizes for the same signals. That's not intelligent scaling. It's a flattening of intelligence.' Biology already knows this: ‘Healthy ecosystems don't maximize efficiency. They maximize diversity, redundancy, and resilience.' Human intelligence evolved under constraints — time, uncertainty, disagreement. ‘Those limits forced exploration. Abundant intelligence removes friction and friction is where judgment forms.' ‘The real question isn't how much intelligence can be generated. It's what kind of intelligence do we preserve?'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">22 · AI and the Wedding Vows<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 21. A carousel story: ‘A groom used AI to write his wedding vows. His bride left him.' The vows were beautiful — eloquent, moving, everything you'd want to hear. ‘But vows are proof. They say: I sat with my feelings, struggled to find the words, and brought that struggle to you. You're worth doing hard things for.' ‘When she found out, she didn't hear eloquence. She heard a man who asked for her deepest emotional presence while offering an algorithm in return.' The broader pattern: ‘We keep doing versions of this. Polished emails we didn't write. Thoughtful messages that cost us nothing. Asking for full attention while giving something generated.' ‘The fix isn't never use AI. The fix is being honest about when you did.'<\u002Fp>\n<h2 style=\"margin-top:2.2em;font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">Section 04<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Section four. What AI clarifies about human intelligence, why judgment gets more valuable, and why accountability needs a person.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">23 · What Human Intelligence Really Is<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 22. ‘People keep asking whether AI thinks like us. That question misses the point. The important thing isn't similarity, it's contrast.' AI generates language, images and strategies ‘without experience, without embodiment, without stakes. They don't feel confusion, they don't hesitate because something matters, they don't live with the consequences of being wrong.' In cognitive science, human intelligence isn't just a brain thing: ‘It's grounded in a body, an emotion, and social feedback. It happens through interaction with the world, not inside a sealed box.' Humans don't passively process information — ‘we act to maintain coherence in a world of uncertainty. We don't just predict, we care about when predictions fail.' ‘A lot of what we used to call thinking was actually just pattern completion. What remains — judgment, responsibility, imagination, moral weight — can't be separated from lived experience.' ‘AI doesn't cheapen human intelligence, it clarifies it, strips away the parts that can be automated, leaves behind the parts that are inseparable from being alive.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">24 · The Power of One Decision<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 23. A brief, philosophical lesson: ‘The illusion is that change takes time. The truth is change happens the moment you decide.' There are infinite versions of you, each shaped by a different choice. ‘One decision. One gentle pivot and the entire path unfolds differently.' ‘If you're wondering what to do, just listen. The version of you who already chose is calling you home.' This connects to human authorship: the capacity to decide, to choose deliberately, is the core human act that AI cannot perform for you.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">25 · Judgment Gets More Valuable<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 24. A key economics concept: complements. ‘When coffee gets cheap, the price of cream and sugar goes up, more people drink coffee, so they need more cream and sugar. The cheap thing increases demand for its complements.' ‘AI's making decisions cheap. You can analyze, draft, prototype, test, faster and cheaper than ever. So what goes up? The thing AI can't do: judgment about which decisions are worth making and whether the output is actually any good.' Example from Helen's research: a partner used AI to fill out an important application — the whole thing — and it was bad, got the point of the questions wrong, even expanded acronyms wrong. A human would never have made those mistakes, because a human would have read the room. ‘AI made filling out the application cheap. It didn't make it good. The judgment to know whether the answer's actually landed. That just got more valuable.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">26 · Accountability Requires a Person<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 25. ‘AI can make a decision. What it can't do is be accountable for one.' A social media influencer in Helen's research: ‘I will never let AI make an ethical determination because it cannot be held responsible. The final decision to edit and publish will always be mine and mine alone as I can be held responsible.' When a doctor recommends treatment, they put their license on the line. When a lawyer gives advice, they're personally liable. ‘AI can generate the recommendation. It can't own what happens next. And we ask humans. We expect someone to own it.' ‘The people who are thriving with AI are the ones who know what they're accountable for and for how they show up for others.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">27 · The Danger of Viral Panic<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 26. Matt Schumer, an AI startup CEO, published ‘something big is happening' — 75 million views. He compared the moment to February 2020 before COVID. His advice: learn to use AI and tidy up your finances. A terminal diagnosis with no options. Helen's critique: ‘His whole argument rides on one thing, code. AI got really good at writing software. But software is the easiest domain for AI. Clear, right answers, automated testing, the machine can check its own work. Generalizing from that to all knowledge work is like watching a calculator beat you at math and deciding it's about to outperform you at parenting.' ‘We actually have more evidence that AI is increasing the need for human judgment than replacing it.' But the viral moment matters: research shows it only takes 3.5% of a population to drive societal change. Helen's response: ‘More human judgment, not less. More accountability, more complexity. The world doesn't fit on a benchmark graph and we haven't solved all our problems yet.'<\u002Fp>\n<h2 style=\"margin-top:2.2em;font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">Section 05<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Section five, the longest. The economics: why the inevitability and competition frames are wrong, what complements are, and where value actually concentrates.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">28 · Inevitability and Competition<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lessons 27–28. Everything about AI and jobs is framed two ways: inevitability (technology gets better, jobs disappear, nothing anyone can do) and competition (you versus the machine, and the machine wins). Both frames are wrong — ‘they happen to be the way of seeing it that benefits the people selling the technology.' Mustafa Suleyman, CEO of Microsoft AI, said most white-collar jobs will be fully automatable within 12 to 18 months. Helen's response: ‘That's a sales pitch. His company and other major AI companies have collectively invested three quarters of a trillion dollars in AI infrastructure. That money needs to return and the only way that math works is if AI replaces human labor at massive scale.' Economies are loops: ‘Companies pay workers, workers buy things, revenue comes back. Automate away the workers and the customers disappear.' Henry Ford figured this out 100 years ago — paying workers enough to buy the cars they built isn't charity, ‘it's a minimum viable economy.' If every company replaces people with the same AI models, what is any company actually worth? ‘Your talent was your moat, your institutional knowledge, the judgment your people built over decades.' Institutional knowledge isn't a stockpile you can extract — ‘it's a river. Cut off the source and it dries up.' Helen acknowledges AI is moving fast and some of what's coming is real: agents, vibe coding, self-improving systems. ‘If you're not paying attention to this and learning how to work with AI, you are making a mistake.' But the real story is complementarity. ‘What if the economics says that putting human intelligence and artificial intelligence together actually makes both more valuable? That's what 200 years of economic theory actually says and nobody is really telling us that story.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">29 · Complements<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 29. A core concept from labour economics: the tasks that can't be replaced by technology become more valuable because of it. Any real piece of work combines multiple inputs — ‘brains and brawn, creativity and repetition, technical mastery and intuitive judgment.' These inputs are complements: ‘when a technology makes one of them cheap, the other gets more valuable every time.' Photography: film was expensive, developing was expensive. Digital killed that overnight — Kodak collapsed. Then it got complicated: ‘We went from paying for film to paying for storage.' Businesses nobody saw coming emerged. Everyone could photograph everything — genuinely wonderful. The school photographer with terrible pricing? Still there. But ‘the photographers with the eye, the composition, the timing, the instinct for the moment — they became the whole point. The cheap part got automated. The hard part got more valuable.' ‘AI is making a huge number of cognitive tasks cheap right now. In your work, what's the film? What's the eye?' AI can draft a perfect email in four seconds — ‘it can't tell you that sending it today is a terrible idea because you heard something in the client's voice on the last call.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">30 · Software Doesn't Generalise<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 30. Responding to the argument that software touches everything, so AI coding mastery generalises to all work: ‘Software touches everything doesn't mean everything reduces to software. Water touches everything in biology. That doesn't mean mastering hydraulics makes you a neuroscientist.' ‘The gains from Claude Code in non-software jobs are gains in software-shaped parts of those jobs. That's a real thing. It's just a much smaller claim.' To believe full generalisation you must believe all of the following simultaneously: real-time continual learning (current systems are frozen at inference); access to the adjacent possible (locally determined by affordances calibrated to human bodies and minds); near 100% reliability (‘a 5% error rate across 50 interdependent steps gives you a roughly 8% chance of the final output being right'); full articulation of tacit knowledge — what we know but can't say; and full physical embodiment or perfect surveillance — a therapist reading micro-expressions, a surgeon feeling tissue resistance, a teacher noticing a child has gone quiet. ‘What would you have to believe for those gains to generalize to everything? The answer is a lot. And most of it doesn't exist yet.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">31 · The Dust Bowl Metaphor<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 31. ‘In the 1920s, American farmers pushed into the Great Plains. They plowed under the native prairie grasses — diverse, deep-rooted, evolved over thousands of years — and replaced them with single cash crops. For a few years, yields were incredible. Then the drought hit. With those complex root systems gone, the earth just blew away. The Dust Bowl.' ‘What's happening in organisations right now is the same pattern. AI leaders are plowing under the root systems of human work — the mentorship, the judgment that builds through friction, the institutional knowledge that lives in people not documents.' Short-term it looks like efficiency. But ‘our economy, like that prairie soil, depends on human complexity that took decades to grow.' ‘The Dust Bowl took 30 years of drought to reveal how fragile the monoculture was. The AI monoculture might move even faster.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">32 · Baumol's Cost Disease<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 33. ‘Your hair stylist takes the same amount of time to cut your hair as 50 years ago. No technology has made that faster, and yet it costs 10 times what it did in 1975.' Why? Everything around the stylist got more productive — wages went up across the economy, and the stylist needed to be paid enough not to leave. This is Baumol's Cost Disease, from the 1960s: ‘When technology makes some sectors wildly productive, the sectors that can't be touched get more expensive — not because they got better, because everything around them got cheaper.' That's why we can't build houses fast enough and why childcare costs keep rising. For 200 years the work that stubbornly needed a human was usually physical. ‘But AI changes it, because AI is the first automation technology that's pushing into territory that used to be protected by Baumol.' It's entering education, healthcare, legal advice, therapy, creative work. Does the principle hold? ‘I think it does, but the line moved.' The question: which specific part of this work stubbornly needs a human, even when AI can do everything around it? Example: ‘AI can teach your kid calculus, probably better than most tutors, but the teacher who notices that your kid stopped making eye contact three weeks ago and calls you about it? That's a different kind of work entirely, and that work is repricing upwards right now.' ‘Next time you finish a piece of work, look at what you actually did. How much was process and how much was judgment? The process part is getting cheaper by the month. The judgment part is your price going up.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">33 · Hard Parts vs. Easy Parts<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 35. ‘Taxi drivers and accountants both got automated. One group got poorer, the other got richer.' London cabbies spent years memorising 25,000 streets — the Knowledge. GPS automated that expertise. ‘Suddenly anyone with a car and a phone could do the job. Employment in ride services went up 250%. Wages flat.' Because the hard part — the expertise — was gone. Computers automated accountants' routine part: data entry, bookkeeping, repetitive calculations. What was left was complex analytical work requiring more expertise. ‘Wages went up, the job got more specialised and more valuable.' Same dynamic, opposite outcomes. ‘The difference is whether the technology took the hard parts or the easy parts.' If technology takes the hard parts — expertise, years of learning — you get more competition and lower wages, because the barrier to entry disappeared. If it takes the easy parts, you get more specialisation and higher wages. ‘The right question is: in my job, is AI taking the hard parts or the easy parts?'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">34 · Weak Links<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 34. ‘The system is only as productive as its least productive essential part.' Economists call these weak links. Flight example: ‘Automate booking, check-in, baggage handling, navigation, even most of the flying. Then it lands and needs a gate and a ground crew and 300 people need to shuffle down a narrow aisle.' The bottleneck moves to the ground. Moving house: ‘Everything's packed perfectly. The truck's loaded. Then two people need to carry the couch up three flights of stairs.' A Stanford economist calculated that even with infinite software productivity, GDP goes up by 2% — because software is only 2% of the economy. Even automating every cognitive job on earth, ‘the economy grows by 50% — you just replaced all human thinking and the system only got half as big again.' ‘The transformation doesn't look like everything getting replaced at once. It looks like value concentrating in the tasks that resist automation. The weak links become the expensive links. The bottleneck becomes the whole game.' ‘In your work, are you the flight or the ground?'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">35 · Saturation vs. Jevons<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 36. ‘When the cost of producing something drops to nearly zero, demand doesn't go to infinity, it saturates.' Only so many blog posts, product descriptions and social graphics anyone wants. Stock photography: those ads in your feed — ‘Oregon drivers delighted by this new insurance change' — used to be stock photography, now they're AI generated. ‘Mostly no one cares. No one ever really cared. The image was filler. Filling a rectangle is not a job that survives when a machine can fill it for free.' ‘AI didn't devalue that work. It revealed what the market actually valued it at.' But simultaneously, Jevons' paradox: ‘When a resource gets dramatically cheaper, consumption doesn't top out. It expands into territory that was always there but never reachable.' Vibe coding is opening up problems ‘too local, too specific, too contextual for any commercial product to justify building.' ‘Two things are true at the same time. If your work is in the rectangle — commodity, replicable, indistinguishable from what a machine produces — that market's collapsing and it isn't coming back. But if your work is 20 years of frontline knowledge about a specific hard problem that no one ever built software for, that market is just opening.' ‘Commodity goes to zero. Specific contextual irreplaceable goes up. And the middle disappears.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">36 · The Economic Loop Can Break<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 37. The economy is a loop: ‘The plumber fixes the sink, the plumber pays the teacher, the teacher pays the plumber's kid, the accountant does both their taxes. Each person earns because they're someone else's customer.' Under substitution: ‘I don't ask the accountant to do my taxes. I ask AI. The accountant spends less at the restaurant. The restaurant cuts shifts, the server can't afford tutoring.' This isn't a recession, which is temporary. ‘Substitution changes it structurally. The loop doesn't just slow, it actually breaks.' Dario Amodei suggested a future where Silicon Valley grows at extraordinary rates while much of the country sees little change — a concentrated boom against broad stagnation. But Helen argues the loop doesn't break automatically; it depends on how organisations interpret automation. ‘If jobs are treated as task lists that disappear one by one, substitution dominates. If jobs are understood as bundles, where automation removes commodity elements and amplifies human ones, value redistributes rather than vanishes.' The forces discussed throughout the series — Baumol effects, task reshaping, persistence of judgment, complementarity — push against simple loop collapse. And automation doesn't only substitute existing work, it expands what can be attempted. ‘What problems around you remain unsolved because they feel impractical, expensive or impossible?'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">37 · Country of Geniuses<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 38. Dario Amodei's vision: ‘a country of geniuses in a data centre.' Helen: ‘Notice what that framing does. It puts the genius in the machine. It concentrates intelligence in one place. It's very top-down. It puts us on the receiving end.' ‘Imagine if instead he'd said: what if we could make every worker a genius at their job? Same technology, completely different world.' In that framing you'd be investing in people, building up not replacing down. ‘Most important knowledge in an economy is never centralized. It's local.' The account manager who knows a client is about to leave before any metric picks it up. The product manager who knows which feature requests are really about a different problem. ‘That knowledge doesn't exist in any dataset. You can't put it in a data centre.' ‘A country of geniuses in a data centre is a total monoculture. One model, same outputs, same answers for everyone.' By contrast, actual people with different knowledge in different contexts augmented by AI — ‘that's where the growth is going to come from.' ‘Concentrate intelligence and you flatten it. Distribute it and you multiply it.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">38 · The Reliability Gap<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lessons 39 and 54. AI capability advances exponentially; reliability improves only linearly. ‘What you can trust a machine with depends on reliability, not on capability.' Helen ran technology for New Zealand's national grid: ‘Reliability is supported by human intuition built through years of exposure to contingencies. You don't just need a system that works most of the time. You need a system that behaves predictably when things go wrong.' Autonomous driving: demonstrating capability in specific environments with human backup took years; going from that to citywide deployment in San Francisco took over a decade. ‘That gap wasn't in capability, it was in reliability — reaching five nines.' ‘When reliability is incomplete, humans remain responsible for the outcomes, but the agentic architecture positions humans as monitors rather than active participants in cognition. Monitoring is not the same as doing.' Car analogy: ‘A test drive on a sunny highway tells you the car is capable. Trustworthiness is whether the car starts every morning in January, whether the brakes hold on a wet school crossing at 3pm with kids everywhere.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">39 · The Hard Parts Are Invisible<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 40. Three reasons the hardest parts of work are invisible. First, human infrastructure: ‘Think about a company that runs smoothly. Clients stay, teams coordinate, projects ship, crises don't happen. Nobody notices that work because infrastructure is only visible when it fails.' The negotiation that prevented conflict, the call that kept a client, the nudge over coffee that stopped a bad decision. Second, outside the metric — Goodhart's Law: ‘When a measure becomes a target, it stops being a good measure.' AI inherits this blind spot, optimising loss functions. ‘Judgment, timing, responsibility, trust — these just don't show up as clean training signals.' Third, counterfactual: ‘The crisis that didn't happen, the client that didn't leave, the reputation risk avoided.' Prevention requires reasoning about what would have happened otherwise. ‘AI learns from what actually happened. Humans are believed to be the only intelligence that has the skill of counterfactual reasoning.' Additionally, most real work happens in open systems where goals shift, context changes and feedback is delayed. ‘AI performs best where rules are stable and outcomes are verifiable. Many professional decisions lack both.' ‘The professionals with the strongest judgment are often doing the work that makes everybody else's output possible.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">40 · AI Expands the Problem Space<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 41. ‘There's an assumption that AI solves problems, then the problem space shrinks and work disappears. That's not what happens inside real organisations.' Marketing: ten years ago you'd pick a few channels, build a campaign, measure, adjust next quarter. Today you can ‘generate hundreds of campaign variants in minutes, segment audiences in real time, personalised messaging dynamically, run continuous experiments. Execution got easier, but decision complexity exploded.' ‘Every new option creates more coordination, more trade-offs, more risk, more unintended consequences, so more accountability.' ‘AI expands what can be done. It doesn't simplify what must be decided.' AI can generate options — ‘it can't own the choice between them.' Agent systems can act, ‘but coordination is about aligning people and incentives and timing.' Valuable work that's expanding: ‘Holding brand coherence across thousands of experiments, deciding where not to launch, spotting second-order effects before customers react, balancing short-term metrics with long-term trust.' ‘Substitution is visible. Expansion requires imagination of problems that don't exist yet, which is why the conversation defaults to job loss.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom
