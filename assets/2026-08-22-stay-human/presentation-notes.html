:.3em;margin-bottom:.6em\">41 · Most CEOs Barely Use AI<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 42. ‘Most CEOs use AI less than two hours a week. A quarter don't use it at all. More than 80 to 90% report no impact on employment or productivity over the past three years.' Yet many forecast employment reductions. Block laid off 4,000 people as AI-driven restructuring; Wall Street sent the stock up 24%. ‘The rationale: once you cut a team from 10 to 1, the remaining person has no choice but to absorb AI. That increases adoption numbers, which makes the original rationale look correct. The layoffs become a forcing function that creates the evidence for itself.' ‘What gets rewarded on Wall Street tends to get repeated.' But there's a window: ‘Your boss is still probably trying to figure out what to do. You can be that person who walks in and says, what if we use this to make 10 of us better instead of replacing nine of us? What if we push hard with AI and take on the harder problems we never had time for?' ‘Very few people have heard someone on their team come in with a specific proposal for how AI makes the group more valuable instead of smaller.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">42 · Entry-Level Jobs Are Corn Seed<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 43. Companies are cutting entry-level hiring in fields where AI can do the tasks juniors used to do: legal research, financial analysis, code writing, content production. On paper, why hire a 23-year-old for something AI does faster and cheaper? ‘There's an old farming rule. Don't eat your corn seed.' Entry-level jobs look like cheap labour. ‘They're actually the mechanism through which expertise gets built.' ‘A junior lawyer isn't just doing legal research. She's learning what matters in a case. A junior analyst isn't just building spreadsheets. He's developing the judgment to know when the numbers don't make sense.' The fields hit hardest are ones where junior work produces a visible output AI can replicate — a draft, a memo, a chunk of code. Entry-level holds up where junior work is physical, relational, or happens in unpredictable environments: ‘You still need that junior nurse on the ward.' ‘The draft that AI produces is a draft. The expertise that a junior builds by producing that draft is what eventually turns them into the person who knows when the draft is wrong.' Helen notes IBM announced tripling entry-level hiring, which makes sense if you want to redesign work — give it to the people with no priors.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">43 · Five Types of AI in Work<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 44. Economists group AI into five types: labour augmenting (makes people better at what they do), capital augmenting (makes systems faster or cheaper), automating (substitutes machines for humans), expertise levelling (lets more people perform high-skilled work), and new task generating (generates entirely new human work). ‘Only one centres on substitution. Only one — new task creation — is clearly pro-human. Everything else depends on design and incentives.' Road-building analogy: ‘You can either bypass the town, or build it to connect the same town to new markets. Same material, same engineering. Opposite outcomes for the people who actually live there.' ‘Right now, investment energy is flowing heavily towards automation. And AGI is becoming defined as replacing humans. That's also not inevitable. It reflects what's easiest to model financially.' ‘Which of those five types is your company building towards? Are you part of that decision?'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">44 · Jobs Are Not Answer Production<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 45. ‘It's surprisingly easy to think that a job exists to produce the right answer.' But ‘jobs aren't answer production systems. They're systems for turning uncertainty into coordinated action while preserving responsibility and trust.' We learn to see work as answer production because ‘schooling rewards correct responses, software interfaces optimise for output, and metrics privilege measurable results.' But ‘organisations don't hire people only to produce answers. They hire people to decide, commit, coordinate, and act under uncertainty.' Meeting example: ‘On paper, it looks like just information exchange. In practice, it's a space where interpretations get negotiated, authority gets tested, risks get calibrated, and responsibility gets assigned. The outcome isn't a single correct answer. It's a shared willingness to move forward.' ‘AI expands answer production dramatically. What it doesn't replace is the work of deciding which answer to act on, who stands behind it, and how consequences are managed when uncertainty remains.' ‘The future of work may hinge less on who produces answers, and more on who can navigate the ambiguity, coordinate belief systems, and commit to action when certainty is impossible. These are higher-level skills, learned over time with experience, and mostly learned socially.'<\u002Fp>\n<h2 style=\"margin-top:2.2em;font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">Section 06<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Section six, the practical section. Twenty-nine slides on how to compete with AI, stay non-modular, protect decision-making capacity, and what full replacement would actually require.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">45 · Make the Invisible Visible<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 46. ‘Competing with AI sucks, and in some ways it's getting harder.' Drafting is cheap — reports, slides, summaries, emails. ‘If your visible value is production volume, you place yourself in a pretty compressible layer of work.' But ‘you can change what people see. You can point out the invisible, incompressible, hard parts where human decision-making matters. Most people don't see it until it's pointed out.' Practical advice: ‘When you send work, start to include what decision supports this, what the key trade-offs are, the risk you're keeping track of and managing that they don't have to worry about. Make that show.' ‘Judgment compounds over time and what happens is trust gets built. Whereas output is just about scale.' ‘Position yourself where compounding happens and give people a reason to notice what they otherwise might not.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">46 · Don't Become Modular<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 47. ‘People are unwittingly training AI to do a lot of their work. It's a kind of expertise theft and it's happening anywhere your interactions have been tracked.' ‘Don't become modular. AI handles bounded tasks really well. It does less well with alignment across people and incentives and uncertainty.' Widen your function: focus on translating across teams, holding competing priorities, absorbing accountability. ‘Modular work is discrete tasks with clear inputs and outputs. It's exactly what AI compresses first. The less modular your contribution, the harder it is to swap out.' Test: ‘If someone listed every task you do, could they hand that list to an AI and get 80% of the way there? If yes, you're too modular.' Five things that don't fit on a task list: knowing context across teams, translating between people who think differently, making the call when nobody's sure, improvising the plan when the plan breaks, and reading other people. ‘Count how many are part of your job — that's your non-modular score. Pick one you're weakest at and volunteer for it next week.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">47 · Nobody Notices Who's Steering<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 48. ‘AI isn't the biggest change happening to human intelligence right now. The biggest change is that most people have stopped noticing who's doing the steering.' Humans have always offloaded cognition — calculators, GPS. ‘Our brains run on about 20 watts. AI runs on gigawatts. That's not an accident, it's evolution. It's a biological imperative to offload, so we will take that deal.' ‘The real risk is drifting out of authorship of your own thinking. We call this cognitive sovereignty.' Two contrasting examples: a developer ‘stopped paying attention while coding with AI. The code was fine, that's not the point. He couldn't tell you the moment he stopped making decisions.' A clinical coder at a hospital uses AI just as heavily — ‘when it suggests a wrong answer, she corrects it and explains her reasoning back to it. She said AI helps her converse with her own thoughts.' Same tool, same depth — ‘one drifted and one stayed the author.' Practical check: ‘After your next AI work session, ask yourself: at what point did you stop choosing and start following?'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">48 · More Agents, Worse Decisions<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 49. ‘More AI agents, worse decisions. That's what's actually happening right now for a lot of people.' Teams roll out multiple agents — coding, research, analysis — sometimes measuring token consumption as a performance metric. Helen's research finding: ‘Productivity goes up when you add a second agent. It goes up again with a third. After three, it drops.' Your brain can't oversee more than three AI systems and still have anything left for judgment — ‘maybe that's a hard limit.' ‘Your decision-making capacity is finite. Spend it all on oversight. You haven't got anything left for the work that really matters.' A physicist in the research ‘uses AI really intensively. But he treats it as a way to know what to search for. Then he verifies each idea himself.' The search space gets bigger with AI, ‘but the decisions stay very much his. That's definitely cognitive sovereignty.' Personal check: ‘After a day working with AI, have I got more capacity for decisions or less? If the answer is less, the AI isn't making me productive, it's eroding my ability to make decisions.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">49 · Six Reasons Humans Aren't Going Anywhere<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 50. Helen states: ‘I'm going to say AI is intelligent. I'm not in the camp that says that AI is a stochastic parrot. These systems find real patterns and they reason with them, and that is intelligence.' Six reasons humans persist: (1) cheaper cognition creates more problems worth solving — ‘when something powerful gets cheap, we don't do the same stuff for less money. We go after problems we would never have touched.' (2) AI learns from the past — genuinely new ideas so far only come from biological intelligence out in the world, noticing things that haven't been formalized. (3) AI generates, humans select — plausibility isn't necessarily correct; choosing what matters in your specific situation is a fundamentally different act. (4) The most valuable knowledge resists capture — judgment under uncertainty is about values, and capturing it in math loses the thing itself. (5) Somebody has to be responsible — you can license a doctor, sue a company, vote out a politician; AI can't play that role. (6) People want human things — therapy from a person, teaching from a person, leadership you can look in the eye. ‘These aren't reasons to be in denial. They're reasons to start working with AI.' But whether we capture the value is about power, about politics.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">50 · The Adjacent Possible<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 51. Stuart Kauffman's concept from complexity science: ‘At any moment, there are new possibilities sitting right at the edge of what currently exists.' His deep insight: they can't be listed in advance. ‘They only reveal themselves when someone embedded in the world bumps into something and notices that it matters.' Penicillin: ‘Fleming wasn't looking for antibiotics. He noticed mold killing bacteria on a petri dish and realized it was significant. That possibility was physically there, but it only became knowledge when a particular human recognized it. No one could have prompted it, because no one knew it was a thing to look for.' A logistics founder spent years in the field, watched people struggle with a problem nobody had cleanly named, then encountered two unrelated technologies and realized the combination solved the exact problem. AI could suggest combinations, ‘but it doesn't know the need.' ‘An LLM has no environment, no embodiment, no needs. Everything it knows was put there by humans who already noticed it and wrote it down. It searches a pre-stated possibility space with extraordinary power. But it can't yet expand that space.' On robots: current robots operate in pre-specified environments for pre-defined tasks. ‘When someone tells me AGI is imminent, I ask one question: how does your system access the adjacent possible?'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">51 · What AGI Actually Requires<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 52. ‘Let's be honest about what people mean when they say AGI. They don't mean a technical milestone anymore. They actually mean replacement.' A machine that does everything a human can, making humans optional. What full replacement requires: a machine that can access the adjacent possible, encounter genuine novelty, act on it and recognize what it's for, create something transformational out of it. Demis Hassabis frames the bar as creating new scientific hypotheses while not making silly mistakes like hallucinations. Helen thinks we're further away than many suggest. The breakthroughs required: continual learning without catastrophic forgetting; learning from sparse data the way humans do; world models with actual causal understanding, not just statistical patterns. ‘Nobody knows if scale gets you there. Probably not.' And even if a machine did access the adjacent possible, ‘its adjacent possible would be completely alien to ours.' Machine intelligence becoming more general ‘almost certainly becomes more alien, more different from us, not more similar.' The frame is partnership across different kinds of intelligence, not replacement. ‘AGI is partly a faith claim. Humans have always wanted an oracle system that just knows and decides for us. AGI is a secular version of that desire. But humans also want agency. They want to decide. They want to matter.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">52 · The Pie Gets Bigger<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 53. A study mapping theoretical vs. actual AI capability: computer/math occupations, 94% theoretically automatable, 33% actually automated. Legal: 80% theoretical, 15% actual. One reading: look how much room for automation to grow. Helen's reading: ‘What happens when the circle gets 10 times bigger? Every time AI handles something routine, it reveals problems and opportunities that weren't visible before.' ‘Charts like this drive the conversation towards who loses their slice. But what really matters is how AI and humans together make the pie dramatically bigger. The new slices don't have job titles yet, so they don't show up on any chart.' ‘Think about that long list of questions you have, ideas that interest you, but you never seem to get to — you don't have time, you don't have the skills. I would bet your list is non-trivial, and if you had a way to pursue them, your own pie would get a lot bigger.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">53 · Capability vs. Trust<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 54. ‘AI agents take actions. They don't just answer questions — they book meetings, write, run code, manage workflows, make decisions in sequence, and do things in the world on your behalf.' The critical chart: capability improving exponentially, reliability improving at a constant rate, linearly. ‘This is the gap that matters. AI is getting dramatically more capable and only slightly more reliable.' Car analogy: ‘Test drive on a sunny highway — that's a benchmark. Trustworthiness is whether the car starts every morning in January, whether the brakes hold on a wet school crossing.' ‘Consistency under pressure, robustness to unexpected inputs, predictability when things get weird. Those are moving quite slowly. And those are the dimensions that determine whether you'll trust it with something that actually matters.' ‘Whenever I see an impressive agent demo, I always ask: was that the sunny highway or was it the school crossing? Was the task clean and well-defined, or messy and unpredictable?'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">54 · The Alignment Problem Is About Us<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 55. ‘The greatest unsolved problem in AI has nothing to do with AI. It has to do with you.' Helen sits in research sessions at an advanced AI lab where world-class researchers are stuck: ‘They can't figure out what humans want.' ‘Most of the time, humans don't know what they want.' Did you know at 20 what would matter at 40? ‘You built those values over years through experience and mistakes and relationships and struggle.' Philosopher Ruth Chang: ‘We don't discover our values like facts waiting to be found. We author them. We commit to them through an active process of choosing, especially in hard choices.' The alignment researchers are trying to specify human values precisely enough that a machine can optimize for them — ‘they need your preferences in a form that can be coded.' But values ‘shift as you grow. They resist specification. You figure them out by living.' Thi Nguyen's value capture in reverse: ‘The researchers are trying to capture human values into a system and the values keep escaping because that's what they do. They resist being pinned down. That resistance is the signal they're actually real.' ‘AI can optimise for a goal that you give it, but it can't help you figure out what your goal should be. Not really. It can't do the decades of living that teach you what matters.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">55 · The Most Entangled Users Stay Most Themselves<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 56. ‘Everyone assumes that the more you use AI, the more it erodes your thinking.' Helen studied over a thousand people and found the opposite. ‘The highest cognitive sovereignty scores were the ones we call co-authors. People who have AI fully inside their reasoning process. Maximum integration on every dimension.' ‘They score highest on awareness, agency, and accountability — the three components of cognitive sovereignty. They can describe exactly what AI does and what they do. They choose the relationship deliberately. They stay embedded in human relationships that keep them honest.' Lowest scores: outsourcers. ‘Their identity has shifted around AI, but they keep AI outside their reasoning. They delegate to it. They receive the output and pass it along.' ‘The variable that matters is whether you're inside the cognitive process or outside it, not how much you use it. Thinking with AI looks like entanglement, but it's actually engagement. Delegating to AI looks like healthy distance, but it can actually be where the drift happens.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">56 · Three Components of Cognitive Sovereignty<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 56 continued. Three components that determine whether someone maintains cognitive sovereignty. Awareness: ‘Can you describe what's happening in your relationship with AI? Not just what tasks you use it for, but how it's changing your thinking.' Agency: ‘Do you have genuine choice or has your workflow been restructured around AI in ways you didn't choose and can't easily reverse?' Accountability: ‘Are you still embedded in human relationships where people know your mind, challenge your reasoning, and notice when something shifts?' ‘When all three are present, people maintain cognitive sovereignty, even at deep integration. When they erode, drift follows quickly — it doesn't announce itself, it accumulates through small efficiencies until someone looks up and they can't quite remember what they used to bring to work.' ‘The risk is that human thinking continues, but no longer is being authored by the human doing it.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">57 · Value Capture<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 57. Philosopher Thi Nguyen's concept of value capture: ‘When your real values — the ones that are rich and complicated and resist being pinned down — get replaced by a simple metric. The metric is so clean and so countable that it starts to feel like the real thing.' His deepest insight: ‘Genuine values are ephemeral. They resist being turned into numbers. That resistance is the signal they're actually real.' ‘AI is the most powerful value capture engine ever built because it produces the metrics and the proof at the same time.' Every improvement generates more evidence for itself — benchmarks, capability scores, automation percentages. ‘The scoreboard actually replacing the game.' The funeral director: integrated AI into every part of his day — efficiencies, scheduling, emails, accounts. ‘He said it made him feel replaceable. Every item on his task list could be automated.' But ‘he's the person who sits with a family at the worst moment of their lives and he knows when to speak and when to stay quiet. That doesn't appear on any task list. There's no metric for that. It's the most valuable thing he does and it's completely invisible to the system that evaluates his work.' ‘Next time someone reduces your work to outputs, ask them: what do you think the work is actually for?'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">58 · Greenfield vs. Brownfield<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 58. Software distinction: Greenfield = building something new from scratch. ‘Almost every impressive AI coding demo you've seen is Greenfield. Start fresh, build a thing, ship it.' Brownfield = working inside a system that's been growing for years or decades — ‘millions of lines of code written by people who left years ago, full of weird choices that turn out to be load-bearing.' ‘Almost every actual company on earth is Brownfield, even Google. Google has AI generating over 30% of their code. Their actual engineering velocity has gone up by about 10%. That gap is really important. The code was never really the hard part.' The hard part is knowing which code to write, where it fits, what'll break, what it needs to survive contact with a system that's been evolving for 20 years. This generalises beyond coding: ‘Every job has a Greenfield version and a Brownfield version. The Greenfield is clean, describable, put it in the manual. The Brownfield version is tangled up with history, and context, and relationships, and institutional knowledge. That's a lot of what goes on in organisations. It's the part that gets more important as AI handles more of the Greenfield.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">59 · Individually Smarter, Collectively Dumber<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 59. ‘AI's a great big averaging machine. It pulls everyone towards the same centre.' A massive study: individual scientists using AI get more productive — they publish more and get cited more. ‘On every individual metric, AI is a clear win.' But collectively: ‘The range of what they explored shrank. Scientists engaging with each other's work dropped by 22%. Everyone climbed the same hill faster. Nobody was looking for the other hills.' One researcher called it a tool that benefits individuals but could destroy science as a collective endeavor. Helen sees this in her own research: ‘Everyone feels more productive, but they're also arriving at similar framings and similar AI-suggested approaches as everyone else.' ‘It used to be that when a room full of smart people agreed it signalled alignment. Now it might signal that diversity of perspective got flattened.' Her practice: ‘I now pay attention to the moment that everyone agrees. I check whether there was tension first. I ask whether the agreement came easy and early.' ‘Early consensus used to mean the answer was obvious. Now it might mean the diversity got flattened.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">60 · Seven Ways I Could Be Wrong<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 60. Helen's honest self-interrogation about her humans-plus-AI thesis. (1) Reliability gap: people try many more things and tolerate failure — nobody catches it because there's no one left to check. (2) Intelligence evolving: claims about what AI can't do have a bad track record; she thinks we're further away than some researchers think, but can't rule it out. (3) Accountability becoming a rubber stamp — the human side is just approving what AI already decided. (4) Funding: if nobody funds the expansion — younger people getting access to resources to tackle what wasn't previously possible — the expansion won't show up, and we literally won't know what we're missing. (5) Data complexity: the routine task base is highly automatable; the experienced practitioner layer on top is not; most people's daily hours are in the base, and the base is contracting. (6) Agency and privilege: the people who work well with AI have strong foundations, institutional support, and confidence to hold boundaries — that might not describe most people's actual situation. (7) Timing: too fast for adaptation but too slow for collective action — more like diabetes than COVID, slow enough that it never feels like an emergency but a lot of accumulated damage. ‘I could be right about humans plus AI and wrong about whether the conditions allow it.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">61 · AI Abundance Explodes the Decision Tree<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 61. ‘AI can run a thousand scenarios in minutes. There aren't fewer decisions though. That's a lot more.' A product launch decision branches into who, at what price, in which markets, with what team, on what timeline — five decisions. Pick one (price) and it branches again: margin target, market share vs. profitability, pricing for current vs. future customer. ‘Three layers deep on one branch and there's hundreds of branches.' ‘AI is extraordinary at this. It can model every path, explore every combination. But the more powerful it gets, the more branches it can explore. The decision space doesn't shrink. It explodes.' In practice, people do the opposite of what they should: ‘The tree collapses into one recommendation, one right answer with a confidence interval attached. You get clarity. However, every buried judgment is still there. And AI can make them faster and invisible.' Helen's practice: ‘I now use AI to do the opposite. Show me the tree. Show me every assumption. Show me what breaks if the discount rate moves. Make the branching visible instead of collapsing it.' ‘Cognitive sovereignty is the skill you need to spot when the assumptions are actually hidden value judgments that need your consideration.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">62 · Complementary vs. Competitive Artifacts<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 62. David Krakauer (Santa Fe Institute): ‘Humans are a species that builds external structures to think with. That's what we do. That's what we've always done.' The debate about whether people should offload thinking to AI is over — ‘we will, we are.' Two types of cognitive artifacts. Complementary: make you smarter even after the tool is gone. A map: ‘You study a map of the city and you build a spatial model in your head. Put the map away and you can still navigate. The map reorganized how your brain represents that space. It left a structural trace in your cognition.' Competitive: replace your capacity. ‘GPS navigates so you don't build a spatial model at all. Use it long enough and the capacity it replaces atrophies. The tool competes with your own cognition and wins.' ‘A lot of people are treating AI as competitive artifacts. They hand over the thinking. The more they do that, the less they can do it themselves. But AI can function as a complementary artifact' when used to pressure-test reasoning, see problems from different angles. Practical check: ‘After you use AI, check whether something has changed in your head. You can feel the problem now. You can sense how the parts relate. The AI's gone, but that orientation stays.' If the problem still feels exactly as shapeless as before — ‘the artifact is competing with you.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">63 · Statistical Learning<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 63. Helen's personal example: ‘10 years ago, I ran a major analysis of job automation — Bureau of Labor Statistics data, hundreds of occupations. Took three months.' Most was tedious manual work. ‘And in that process, we learned things we couldn't have learned any other way.' ‘We ran a new version just now. The number crunching took about a day. I could expand the scope and sophistication.' A massive gain — but ‘it only really worked because I already knew what the data meant. I'd already done the slow manual hands-on work a decade ago.' The concept: statistical learning — ‘The person who builds the model learns the most. The repetitive, tedious, unglamorous part of the work is often where your intuition gets built.' ‘I don't know how that changes with AI. And I don't think anyone honestly does. Because the slow, boring version is what made the fast version meaningful.' ‘Now I pay attention to things I do that are slow and hard, but afterwards my intuition is sharper.' Two questions: where do I need to slow down and do something repetitive, and where can I use what I already know to extend into something genuinely new?<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">64 · Long Circuits vs. Short Circuits<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 64. ‘If we're wired for efficiency, why does anyone learn anything, or run a marathon, or spend 10 years mastering a field?' Iain McGilchrist: ‘We have transcended our biology, not through processing power, but through culture and meaning.' Thi Nguyen on games: ‘Games are an art form of agency where we voluntarily take on unnecessary obstacles, not in spite of the difficulty — because of it. The struggle is the point. The marathon runner could drive and a climber could take a helicopter, but they choose not to.' The distinction: short circuits deliver a result; long circuits deliver the person. ‘We choose long circuits because we want to be someone, not just to get something done.' ‘When people tell me that everyone will just offload their thinking to AI because it's easier or faster, I think they're modeling humans as optimization machines. We're much more than optimizers. We're meaning machines. We do hard things because other people expect us to, because we want to earn what we know, because we want to matter.' ‘The biological pull towards offloading is very real, but the cultural pull towards mastery and self-creation is stronger. It always has been.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">65 · Weak Bundles, Strong Bundles<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 65. A new paper by economists at LSE and University of Hong Kong: ‘What if the question isn't can AI read these scans but what happens if you separate scan reading from everything else?' Geoffrey Hinton said in 2016 to stop training radiologists because AI would outperform at reading scans. Helen: ‘It was completely obvious that reading a scan is only part of the job and that's entangled with many other parts.' A radiologist also triages cases, communicates with physicians, trains residents, takes accountability for difficult calls. ‘What the market buys isn't a classification exercise. It's this bundle.' When AI can perform one task inside a job, what happens depends on coordination cost — how costly it is to split that task from everything it's connected to. High coordination cost: the bundle survives. Low coordination cost: the job splits and the human is left with the residual. Three things make a bundle expensive to split: shared context (the same person who read the scan talked to the referring physician), liability (the person who signs the diagnosis can't outsource the consequences), and cross-task spillovers (what you learn doing one task makes you better at the other). Weak bundle example: AI note-taker at a meeting — that splits cleanly. Strong bundle: the project manager who noticed the engineering lead's tone meant ‘this will fail,' then takes them for coffee and gets the real objection on the table. ‘Don't ask how much of it AI can do. Ask how much value is destroyed when tasks are done separately.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">66 · Coordination Costs Are Rising<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 66. Helen goes further than the weak/strong bundles paper: ‘They treat coordination costs as fixed, but I think they're rising.' The hydrologist example: ‘She collects data, analyses it, builds relationships with communities, designs the next study. What she learns in the field shapes how she analyses. Those tasks cross-contaminate each other. The value lives in the same person doing multiple things in the same place over time.' ‘Many of the systems we will need to build around AI will have to assume that adversarial relationships between humans are the default rather than trust. We'll need more verification layers, more compliance checks, more audit trails, not fewer.' Economic consequences: ‘It raises the cost of splitting work even more. It raises the premium on the person who holds the bundle together.' ‘If coordination costs are rising, then more bundles survive, not fewer. Jobs built on context, liability, cross-task spillover, and human-to-human coordination go up in value.' ‘The jobs that look the most exposed because they're task-based may be the ones that are hardest to take apart.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">67 · Generative vs. Discriminative Reasoning<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 67. A distinction from probability theory: generative reasoning runs forward through cause and effect — you have a question, form hypotheses, build methods, generate analysis. Discriminative reasoning runs backward — you start from effects and infer causes. ‘Backward inference is provably harder. You have to hold multiple competing explanations simultaneously without all the anchors that come from having made all those predictions.' This maps onto evaluating AI agent output: ‘You're reconstructing judgment calls that were never made explicit because the agent made them for you.' It feels hard because of a breakdown in procedural learning — the capacity to construct something from scratch, built through making predictions and hitting friction. Helen's experience: ‘This research project took three months 10 years ago. The AI agent produced comparable work in about 10 hours. Then I had a month of backward integration — 12 rounds of increasingly precise questioning just to understand what had been built.' ‘That month was where I learned everything. It used to happen during the analysis. I had to build it retrospectively. And it was hard and awkward.' Practical tip: ‘Before you even look at what your AI agent produced, write down what you expected to find. Just one sentence. What you're looking for is the place where the output differs from what you thought. Start your backwards investigation at that point.' ‘The generator part is still the part that builds you. AI just moved it.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">68 · AI and Cognitive Clutter<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 68. AI disrupts how humans normally communicate. ‘We're quite ambiguous on purpose. Our ambiguity is efficient — you compress, leave gaps, and the other person fills them in.' But AI models mirror the structure of your prompt: ‘Complex prompt, complex response. Users learn this and start overcompensating with more specificity.' A study found: ‘Clutter from how information is organized has three times the negative impact on quality than actual task difficulty.' In human conversation, spirals don't persist — someone pushes back, someone restructures. In AI dialogue, that repair mechanism is absent: ‘Once either speaker enters a high-load pattern, it persists through its own momentum.' ‘The single strongest predictor of quality decline is model-initiated task switching. When the AI introduces subtasks you didn't ask about, it fractures your cognitive map of the task.' Practical advice: keep prompts focused on one subtask; when AI introduces something you didn't ask about, ignore it; if a conversation gets cluttered, start a new one; read output critically before your next prompt — ‘whatever organizational mess you let pass, you're going to get it back amplified.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">69 · Judea Pearl's Ladder of Causation<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 69. Judea Pearl's ladder of causation has three rungs: association (what patterns co-occur), intervention (what happens when you act), and counterfactuals (what would have happened had you acted differently). ‘He proved mathematically that each rung requires information the rung below can't provide.' On AGI, Pearl is very blunt: he doesn't think scaling is going to get us there. No more data or compute crosses the boundary his theorem identifies. A world model must support causal reasoning at all three rungs — not just what tends to happen, but what happens if I intervene and what would have happened if I'd done something different. ‘Current AI lives at rung one.' The internet is full of descriptions of causal reasoning — hasn't it learned the causal structure? Pearl's answer: no. A description of a causal model is not a causal model. ‘Even a robot acting in the world only gets to rung two. Counterfactuals are about situations that never occurred. No amount of interaction with the physical world generates data about things that didn't happen.' Rung 3 reasoning requires an internal model you can manipulate symbolically offline against imagined conditions — that capability is not yet described, and it's the rung that matters for AGI.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">70 · Co-Evolution Through Culture<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 70. ‘I don't mean transhumanism — merging with machines, uploading consciousness. And I don't mean posthumanism — dissolving the boundary between human and AI. What I mean is culture.' ‘Every previous intelligence explosion wasn't an upgrade to individual hardware. It was the emergence of a new social unit of cognition.' Language let knowledge accumulate across generations; bureaucracy created institutions smarter than anyone inside them. ‘When you train a reasoning model purely for accuracy, it spontaneously starts arguing with itself. Multiple perspectives debating and correcting. The model discovered on its own that reasoning is a social process.' Cultural evolution examples: ‘Girls born by C-section are more likely to need one themselves. Our medical practice is reshaping human biology right now. Culture moves faster than genes.' ‘If AI handles ambiguity, the pressure to tolerate ambiguity weakens. If a child's primary conversational partner is a sycophant, different social capacities develop.' ‘AI forces that question across every cognitive domain at once. Which capacities are foundations? Which are labour? In a lot of cases, we just don't know yet.' ‘These will become some of the most political questions of the next 20 years. Engineers will want to settle them — that's the transhumanist instinct. But you can't engineer your way to a value judgment. It gets negotiated in families, classrooms — the same messy places where every other hard cultural question gets fought over.' ‘Co-evolution through culture is not a merge, not transcendence. It's just our species doing what it does — adapting, contesting, choosing.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">71 · Lessons from Y2K to Mythos<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 71. Helen's personal experience: ‘New Zealand was the first country to cross into the new millennium. I was CIO of the National Grid. My team kept the lights on while the world watched.' That was phase one — one problem, one deadline, working institutions. Phase two: ‘Anthropic disclosed that their new model, Mythos, has found thousands of previously unknown security vulnerabilities in every major operating system, every major web browser. Some of those bugs are almost 30 years old.' Finding vulnerabilities like this used to require rare and expensive expertise. Mythos collapsed that cost to nearly zero. These capabilities will exist in other models within months. ‘The institutions that would normally coordinate a response have been gutted or captured.' ‘For 20 years, it was cheaper to use shared code and hope someone else had checked it. When finding and exploiting vulnerabilities is nearly free, running unverified code becomes the most expensive thing you can do.' ‘The response is going to be more AI, not less. Human review at the speed and scale required was already a polite fiction. What replaces it has to be continuous machine-verified security.' Phase three: quantum computing will break cryptographic foundations. ‘We just learned that humans can't find bugs at necessary scale. They certainly can't audit every cryptographic dependency across global infrastructure.' ‘If you're excited about vibe coding as a replacement for enterprise-grade software, consider that you'd be expanding the attack surface at the exact moment that the cost of exploiting it hit zero.'<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">72 · Intelligence Is a Process<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lesson 72. ‘We talk about intelligence like it's a possession, something you have or don't, but in science, that idea is really breaking down.' Intelligence looks more like a process: ‘Information reduces uncertainty, computation transforms information, agency emerges when these systems act on the world, and intelligence shows up when those actions adapt over time.' One definition: ‘Intelligence is the ability to set and achieve goals when shit happens.' This applies to biology, markets, ecosystems, and now machines. ‘That doesn't mean machines are like us. That means intelligence was never exclusively ours. And that realisation is really unsettling, because it forces us to ask: if intelligence isn't what makes us special, what does?' ‘That's where things get interesting.' This is the open question the entire series has been building toward — what is distinctly human is not raw intelligence but the authorship of values, choices, relationships and meaning.<\u002Fp>\n<h2 style=\"font-variant:small-caps;font-size:1.3em;border-bottom:2px solid #ccc;padding-bottom:.3em;margin-bottom:.6em\">73 · The Call to Human Authorship<\u002Fh2>\n<p style=\"margin:0 0 1.4em\">Lessons 1, 2, 48, 56 — synthesis. The series culminates in a practical call to action: author your relationship with AI. Cognitive sovereignty: ‘staying the author of your own mind while you work with AI' — maintained through awareness, agency and accountability. Human authorship: deciding who you want to become and using AI in service of that choice, rather than drifting into a relationship shaped by defaults and convenience. The most entangled users stay most themselves — engagement, not distance, is what preserves sovereignty. The world doesn't fit on a benchmark graph. We haven't solved all our problems yet. The economics of complementarity are on our side. The adjacent possible is waiting. And the work of staying human — maintaining judgment, responsibility, presence, and the slow messy process of building values through living — cannot be automated. ‘You stay human by becoming more human.'<\u002Fp>\n\n<\u002Fdiv>\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
