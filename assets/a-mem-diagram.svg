10.5">puppy, teething, chewing, furniture, pet care</text><text x="100" y="234" fill="#4338ca" font-size="10.5" font-weight="600">Tags:</text><text x="142" y="234" fill="#475569" font-size="10.5">pet-behaviour, puppy-phase, home-damage</text><text x="100" y="255" fill="#4338ca" font-size="10.5" font-weight="600">Context:</text><text x="162" y="255" fill="#475569" font-size="10.5">&quot;User owns a young dog going through teething stage&quot;</text><text x="100" y="276" fill="#4338ca" font-size="10.5" font-weight="600">Embedding:</text><text x="180" y="276" fill="#475569" font-size="10.5">eᵢ = encode(content + keywords + tags + context)</text><text x="100" y="297" fill="#4338ca" font-size="10.5" font-weight="600">Links:</text><text x="148" y="297" fill="#9ca3af" font-size="10.5" font-style="italic">(empty, generated in Step 2)</text><line x1="350" x2="350" y1="328" y2="358" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect width="620" height="245" x="40" y="363" fill="#f8fafc" stroke="#99f6e4" stroke-width="1" rx="10"/></g><text x="60" y="389" fill="#0f766e" font-size="13" font-weight="700">Step 2: Link Generation</text><text x="60" y="407" fill="#0d9488" font-size="10.5">Find top-k similar memories, then LLM evaluates which connections are genuine</text><circle cx="350" cy="468" r="24" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="350" y="464" fill="#4338ca" font-size="9.5" font-weight="700" text-anchor="middle">NEW</text><text x="350" y="477" fill="#4338ca" font-size="8.5" text-anchor="middle">puppy</text><circle cx="160" cy="458" r="20" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="160" y="454" fill="#6b7280" font-size="8.5" font-weight="600" text-anchor="middle">m₁</text><text x="160" y="466" fill="#9ca3af" font-size="7.5" text-anchor="middle">dog food</text><circle cx="540" cy="458" r="20" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="540" y="454" fill="#6b7280" font-size="8.5" f