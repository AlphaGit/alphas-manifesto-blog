 Memory Evolution</text><text x="60" y="687" fill="#b45309" font-size="10.5">LLM re-evaluates linked memories in light of new information and updates them</text><rect width="240" height="115" x="80" y="703" fill="#fff" stroke="#e5e7eb" stroke-width="1" rx="6"/><text x="200" y="722" fill="#9ca3af" font-size="10.5" font-weight="600" text-anchor="middle">m₁ BEFORE</text><text x="100" y="742" fill="#475569" font-size="10">Content: &quot;User bought dog food&quot;</text><text x="100" y="759" fill="#475569" font-size="10">Tags: pet-care, shopping</text><text x="100" y="776" fill="#475569" font-size="10">Context: &quot;User is a dog owner&quot;</text><text x="100" y="793" fill="#475569" font-size="10">Links: [ ]</text><line x1="328" x2="370" y1="760" y2="760" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow)"/><text x="349" y="752" fill="#b45309" font-size="8.5" font-weight="600" text-anchor="middle">evolve</text><rect width="260" height="115" x="380" y="703" fill="#fffbeb" stroke="#fde68a" stroke-width="1" rx="6"/><text x="510" y="722" fill="#92400e" font-size="10.5" font-weight="600" text-anchor="middle">m₁ AFTER</text><text x="400" y="742" fill="#475569" font-size="10">Content: &quot;User bought dog food&quot;</text><text x="400" y="759" fill="#92400e" font-size="10" font-weight="500">Tags: pet-care, shopping, puppy</text><text x="400" y="776" fill="#92400e" font-size="10" font-weight="500">Context: &quot;User owns a teething puppy&quot;</text><text x="400" y="793" fill="#92400e" font-size="10" font-weight="500">Links: [new_memory]</text><line x1="350" x2="350" y1="838" y2="868" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect width="620" height="95" x="40" y="873" fill="#f8fafc" stroke="#c4b5fd" stroke-width="1" rx="10"/></g><text x="60" y="899" fill="#5b21b6" font-size="13" font-weight="700">Retrieval</text><text x="60" y="919" fill="#7c3aed" font-size="10.5">Query embedding → cosine similarity against all memories → return top-k notes</text><text x="60" y="937" fill="#7c3aed" font-size="10.5">Links provide additional context: connected memories are retrieved together</text></svg>