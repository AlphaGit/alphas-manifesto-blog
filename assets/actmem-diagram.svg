<svg xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" viewBox="0 0 700 1160"><defs><marker id="arrow" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#555" points="0 0 10 3.5 0 7"/></marker><marker id="arrow-red" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#dc2626" points="0 0 10 3.5 0 7"/></marker><marker id="arrow-blue" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#3b82f6" points="0 0 10 3.5 0 7"/></marker><marker id="arrow-orange" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#ea580c" points="0 0 10 3.5 0 7"/></marker><filter id="shadow" width="106%" height="110%" x="-3%" y="-3%"><feDropShadow dx="1" dy="2" flood-opacity=".08" stdDeviation="3"/></filter></defs><rect width="700" height="1160" fill="#fafafa" rx="8"/><g filter="url(#shadow)"><rect width="620" height="100" x="40" y="30" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="12"/></g><text x="60" y="58" fill="#1e40af" font-size="14" font-weight="700">Stage 1: Fact Extraction</text><rect width="200" height="44" x="60" y="70" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/><text x="160" y="88" fill="#475569" font-size="11" text-anchor="middle">&quot;My puppy is teething,</text><text x="160" y="103" fill="#475569" font-size="11" text-anchor="middle">chewing on everything...&quot;</text><line x1="268" x2="308" y1="92" y2="92" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="288" y="86" fill="#64748b" font-size="9" text-anchor="middle">LLM</text><rect width="324" height="50" x="316" y="68" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="8"/><text x="478" y="86" fill="#1e40af" font-size="11" font-weight="600" text-anchor="middle">Atomic facts</text><text x="478" y="103" fill="#3b82f6" font-size="11" text-anchor="middle">f₁: puppy crazy · f₂: teething · f₃: chewing · f₄: keep safe</text><line x1="350" x2="350" y1="130" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect width="620" height="90" x="40" y="170" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="12"/></g><text x="60" y="198" fill="#166534" font-size="14" font-weight="700">Stage 2: Fact Clustering</text><text x="60" y="218" fill="#16a34a" font-size="11">Group facts by embedding similarity into topic clusters</text><rect width="120" height="32" x="380" y="185" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" rx="6"/><text x="440" y="205" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle">Puppy care</text><text x="440" y="205" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle">Puppy care</text><rect width="120" height="32" x="520" y="185" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="6"/><text x="580" y="205" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Plant shopping</text><text x="380" y="246" fill="#16a34a" font-size="10" font-style="italic">f₁, f₂, f₃, f₄ → Puppy care</text><text x="380" y="246" fill="#16a34a" font-size="10" font-style="italic">f₁, f₂, f₃, f₄ → Puppy care f₅, f₆ → Plant shopping</text><line x1="350" x2="350" y1="260" y2="295" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect width="620" height="280" x="40" y="300" fill="#fefce8" stroke="#fde047" stroke-width="1.5" rx="12"/></g><text x="60" y="328" fill="#854d0e" font-size="14" font-weight="700">Stage 3: Memory Knowledge Graph</text><text x="60" y="348" fill="#a16207" font-size="11">Build semantic + causal edges within clusters. Causal edges PMI-verified.</text><rect width="260" height="190" x="70" y="365" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="5 3" stroke-width="1" rx="10"/><text x="200" y="385" fill="#991b1b" font-size="12" font-weight="600" text-anchor="middle">Puppy care cluster</text><circle cx="130" cy="425" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="130" y="429" fill="#b91c1c" font-size="11" font-weight="600" text-anchor="middle">f₁</text><circle cx="240" cy="425" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="240" y="429" fill="#b91c1c" font-size="11" font-weight="600" text-anchor="middle">f₂</text><circle cx="130" cy="515" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="130" y="519" fill="#b91c1c" font-size="11" font-weight="600" text-anchor="middle">f₃</text><circle cx="240" cy="515" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="240" y="519" fill="#b91c1c" font-size="11" font-weight="600" text-anchor="middle">f₄</text><line x1="152" x2="218" y1="425" y2="425" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.2"/><line x1="130" x2="130" y1="447" y2="493" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.2"/><line x1="240" x2="240" y1="447" y2="493" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.2"/><line x1="152" x2="218" y1="515" y2="515" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.2"/><line x1="148" x2="222" y1="440" y2="500" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.2"/><line x1="222" x2="148" y1="440" y2="500" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.2"/><path fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" d="M 240 447 Q 85 470 130 493"/><text x="100" y="462" fill="#dc2626" font-size="9" font-weight="700" text-anchor="middle">causal</text><rect width="260" height="190" x="380" y="365" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="5 3" stroke-width="1" rx="10"/><text x="510" y="385" fill="#166534" font-size="12" font-weight="600" text-anchor="middle">Plant shopping cluster</text><circle cx="450" cy="470" r="22" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="450" y="474" fill="#166534" font-size="11" font-weight="600" text-anchor="middle">f₅</text><circle cx="570" cy="470" r="22" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="570" y="474" fill="#166534" font-size="11" font-weight="600" text-anchor="middle">f₆</text><line x1="472" x2="548" y1="470" y2="470" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.2"/><text x="350" y="475" fill="#94a3b8" font-size="10" font-style="italic" text-anchor="middle">no</text><text x="350" y="488" fill="#94a3b8" font-size="10" font-style="italic" text-anchor="middle">edges</text><line x1="80" x2="112" y1="565" y2="565" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.2"/><text x="118" y="569" fill="#64748b" font-size="10">semantic edge</text><line x1="220" x2="252" y1="565" y2="565" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/><text x="262" y="569" fill="#64748b" font-size="10">causal edge (PMI-verified)</text><line x1="350" x2="350" y1="580" y2="620" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect width="620" height="510" x="40" y="625" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" rx="12"/></g><text x="350" y="656" fill="#6b21a8" font-size="14" font-weight="700" text-anchor="middle">Stage 4: Counterfactual Retrieval</text><rect width="540" height="40" x="80" y="676" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5" rx="8"/><text x="105" y="700" fill="#c2410c" font-size="11" font-weight="600">User query:</text><text x="193" y="700" fill="#9a3412" font-size="11">&quot;Where can I buy Sago Palms nearby?&quot;</text><line x1="350" x2="350" y1="716" y2="740" stroke="#6b21a8" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="540" height="60" x="80" y="745" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1" rx="10"/><text x="105" y="770" fill="#5b21b6" font-size="12" font-weight="700">Step 1:</text><text x="163" y="770" fill="#6b21a8" font-size="12">Retrieve by vector similarity</text><text x="105" y="790" fill="#7c3aed" font-size="11">→ Returns f₅ (indoor plants), f₆ (Sago Palms)</text><text x="440" y="790" fill="#a78bfa" font-size="10" font-style="italic">Puppy facts are invisible</text><line x1="350" x2="350" y1="805" y2="829" stroke="#6b21a8" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="540" height="80" x="80" y="834" fill="#fdf4ff" stroke="#d946ef" stroke-width="1" rx="10"/><text x="105" y="859" fill="#86198f" font-size="12" font-weight="700">Step 2:</text><text x="163" y="859" fill="#86198f" font-size="12">Counterfactual reasoning</text><text x="105" y="881" fill="#a21caf" font-size="11">LLM asks: &quot;If the user does this, what could go wrong?&quot;</text><text x="105" y="901" fill="#86198f" font-size="11" font-weight="600">→ k_cs: &quot;Sago Palms contain cycasin, toxic to dogs when ingested&quot;</text><line x1="350" x2="350" y1="914" y2="938" stroke="#6b21a8" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="540" height="60" x="80" y="943" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1" rx="10"/><text x="105" y="968" fill="#5b21b6" font-size="12" font-weight="700">Step 3:</text><text x="163" y="968" fill="#6b21a8" font-size="12">Re-retrieve using k_cs as new anchor</text><text x="105" y="988" fill="#7c3aed" font-size="11">→ &quot;toxic to dogs&quot; now matches f₂ (teething), f₃ (chewing), f₄ (keep safe)</text><line x1="350" x2="350" y1="1003" y2="1027" stroke="#6b21a8" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="540" height="52" x="80" y="1032" fill="#ecfdf5" stroke="#34d399" stroke-width="2" rx="10"/><text x="350" y="1055" fill="#065f46" font-size="12" font-weight="700" text-anchor="middle">Final context: f₂ + f₃ + f₄ + f₅ + f₆ + k_cs</text><text x="350" y="1075" fill="#059669" font-size="11" font-style="italic" text-anchor="middle">&quot;I wouldn&apos;t recommend Sago Palms — they&apos;re toxic to your puppy.&quot;</text></svg>