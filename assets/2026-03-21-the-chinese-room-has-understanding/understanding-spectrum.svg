<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" viewBox="0 0 700 330"><rect width="700" height="330" fill="#f8f8f8" rx="8"/><text x="350" y="28" fill="#4a3f35" font-size="13" font-weight="bold" text-anchor="middle">Searle&apos;s view: binary</text><rect width="322" height="50" x="40" y="42" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5" rx="5"/><text x="200" y="63" fill="#c0392b" font-size="11" font-weight="bold" text-anchor="middle">Doesn&apos;t understand</text><text x="200" y="79" fill="#888" font-size="9" text-anchor="middle">thermostat, gzip, regression, DNN, Chinese Room...</text><rect width="282" height="50" x="378" y="42" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="5"/><text x="519" y="63" fill="#2e7d32" font-size="11" font-weight="bold" text-anchor="middle">Understands</text><text x="519" y="79" fill="#888" font-size="9" text-anchor="middle">medical students, doctors, Einstein...</text><line x1="370" x2="370" y1="38" y2="96" stroke="#4a3f35" stroke-width="2.5"/><text x="370" y="110" fill="#4a3f35" font-size="9" text-anchor="middle">hard boundary</text><line x1="60" x2="640" y1="130" y2="130" stroke="#ddd" stroke-width="1"/><text x="350" y="126" fill="#bbb" font-size="9" font-style="italic" text-anchor="middle">vs.</text><text x="350" y="155" fill="#4a3f35" font-size="13" font-weight="bold" text-anchor="middle">The alternative: a gradient</text><text x="40" y="175" fill="#c0392b" font-size="9">less understanding</text><text x="660" y="175" fill="#2e7d32" font-size="9" text-anchor="end">more understanding</text><defs><linearGradient id="spectrumGrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#fde8e8"/><stop offset="30%" stop-color="#f5dcc0"/><stop offset="60%" stop-color="#d4e8b0"/><stop offset="100%" stop-color="#b5dfb5"/></linearGradient></defs><rect width="620" height="30" x="40" y="182" fill="url(#spectrumGrad)" stroke="#8b7b6f" stroke-width="1" rx="4"/><line x1="70" x2="70" y1="182" y2="212" stroke="#4a3f35" stroke-width="1.5"/><circle cx="70" cy="197" r="4" fill="#4a3f35"/><text x="70" y="228" fill="#666" font-size="9" text-anchor="middle">thermostat</text><line x1="165" x2="165" y1="182" y2="212" stroke="#4a3f35" stroke-width="1.5"/><circle cx="165" cy="197" r="4" fill="#4a3f35"/><text x="165" y="228" fill="#666" font-size="9" text-anchor="middle">linear</text><text x="165" y="239" fill="#666" font-size="9" text-anchor="middle">regression</text><line x1="295" x2="295" y1="182" y2="212" stroke="#4a3f35" stroke-width="1.5"/><circle cx="295" cy="197" r="4" fill="#4a3f35"/><text x="295" y="228" fill="#666" font-size="9" text-anchor="middle">deep neural</text><text x="295" y="239" fill="#666" font-size="9" text-anchor="middle">network</text><line x1="440" x2="440" y1="182" y2="212" stroke="#4a3f35" stroke-width="1.5"/><circle cx="440" cy="197" r="4" fill="#4a3f35"/><text x="440" y="228" fill="#666" font-size="9" text-anchor="middle">medical</text><text x="440" y="239" fill="#666" font-size="9" text-anchor="middle">student</text><line x1="490" x2="490" y1="182" y2="212" stroke="#2471a3" stroke-width="1.5"/><circle cx="490" cy="197" r="5" fill="#2471a3"/><text x="490" y="260" fill="#2471a3" font-size="9" font-weight="bold" text-anchor="middle">Chinese Room</text><text x="490" y="271" fill="#2471a3" font-size="8" text-anchor="middle">(if it works)</text><line x1="550" x2="550" y1="182" y2="212" stroke="#4a3f35" stroke-width="1.5"/><circle cx="550" cy="197" r="4" fill="#4a3f35"/><text x="550" y="228" fill="#666" font-size="9" text-anchor="middle">experienced</text><text x="550" y="239" fill="#666" font-size="9" text-anchor="middle">doctor</text><line x1="630" x2="630" y1="182" y2="212" stroke="#4a3f35" stroke-width="1.5"/><circle cx="630" cy="197" r="4" fill="#4a3f35"/><text x="630" y="228" fill="#666" font-size="9" text-anchor="middle">Einstein</text><line x1="370" x2="370" y1="175" y2="220" stroke="#c0392b" stroke-dasharray="5 3" stroke-width="2"/><text x="370" y="295" fill="#c0392b" font-size="9" text-anchor="middle">Searle draws a line here,</text><text x="370" y="307" fill="#c0392b" font-size="9" text-anchor="middle">anchored to human cognition</text><line x1="370" x2="370" y1="285" y2="223" stroke="#c0392b" stroke-width="1" marker-end="url(#arrowRed)"/><defs><marker id="arrowRed" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#c0392b" points="0 0 8 3 0 6"/></marker></defs></svg>