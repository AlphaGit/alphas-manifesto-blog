<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" viewBox="0 0 700 320"><rect width="700" height="320" fill="#f8f8f8" rx="8"/><text x="350" y="28" fill="#4a3f35" font-size="14" font-weight="bold" text-anchor="middle">The Turing Test</text><rect width="6" height="220" x="310" y="50" fill="#c9b99a" rx="2"/><text x="313" y="290" fill="#8b7b6f" font-size="9" text-anchor="middle">The judge can&apos;t see who&apos;s on the other side.</text><text x="150" y="68" fill="#4a3f35" font-size="12" font-weight="bold" text-anchor="middle">Judge</text><circle cx="150" cy="100" r="16" fill="none" stroke="#4a3f35" stroke-width="2"/><circle cx="144" cy="97" r="1.5" fill="#4a3f35"/><circle cx="156" cy="97" r="1.5" fill="#4a3f35"/><path fill="none" stroke="#4a3f35" stroke-width="1.2" d="M 144,105 Q 150,109 156,105"/><line x1="150" x2="150" y1="116" y2="155" stroke="#4a3f35" stroke-width="2"/><line x1="130" x2="170" y1="135" y2="135" stroke="#4a3f35" stroke-width="2"/><line x1="150" x2="133" y1="155" y2="180" stroke="#4a3f35" stroke-width="2"/><line x1="150" x2="167" y1="155" y2="180" stroke="#4a3f35" stroke-width="2"/><text x="150" y="210" fill="#666" font-size="10" text-anchor="middle">&quot;Which one is human?&quot;</text><line x1="230" x2="305" y1="128" y2="98" stroke="#2471a3" stroke-dasharray="4 3" stroke-width="1.5" marker-end="url(#arrowBlue)"/><line x1="230" x2="305" y1="148" y2="198" stroke="#2471a3" stroke-dasharray="4 3" stroke-width="1.5" marker-end="url(#arrowBlue)"/><rect width="250" height="90" x="365" y="55" fill="#fff" stroke="#8b7b6f" stroke-width="1" rx="6"/><text x="380" y="76" fill="#4a3f35" font-size="11" font-weight="bold">Participant A</text><circle cx="410" cy="112" r="12" fill="none" stroke="#4a3f35" stroke-width="1.5"/><line x1="410" x2="410" y1="124" y2="138" stroke="#4a3f35" stroke-width="1.5"/><line x1="400" x2="420" y1="130" y2="130" stroke="#4a3f35" stroke-width="1.5"/><rect width="165" height="40" x="438" y="96" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="10"/><text x="520" y="113" fill="#2e7d32" font-size="9" text-anchor="middle">&quot;I think the weather is</text><text x="520" y="126" fill="#2e7d32" font-size="9" text-anchor="middle">nice today, don&apos;t you?&quot;</text><rect width="250" height="90" x="365" y="160" fill="#fff" stroke="#8b7b6f" stroke-width="1" rx="6"/><text x="380" y="181" fill="#4a3f35" font-size="11" font-weight="bold">Participant B</text><rect width="24" height="20" x="398" y="199" fill="none" stroke="#4a3f35" stroke-width="1.5" rx="3"/><circle cx="405" cy="208" r="2" fill="#4a3f35"/><circle cx="415" cy="208" r="2" fill="#4a3f35"/><line x1="410" x2="410" y1="195" y2="199" stroke="#4a3f35" stroke-width="1.5"/><rect width="165" height="40" x="438" y="201" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="10"/><text x="520" y="218" fill="#2e7d32" font-size="9" text-anchor="middle">&quot;It&apos;s lovely! Perfect for</text><text x="520" y="231" fill="#2e7d32" font-size="9" text-anchor="middle">a walk in the park.&quot;</text><text x="640" y="105" fill="#8b7b6f" font-size="11" text-anchor="middle">human?</text><path fill="none" stroke="#8b7b6f" stroke-dasharray="3 3" stroke-width="1" d="M 640,112 L 640,183"/><text x="655" y="150" fill="#8b7b6f" font-size="9">or vice</text><text x="655" y="162" fill="#8b7b6f" font-size="9">versa?</text><text x="640" y="200" fill="#8b7b6f" font-size="11" text-anchor="middle">machine?</text><defs><marker id="arrowBlue" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#2471a3" points="0 0 8 3 0 6"/></marker></defs></svg>