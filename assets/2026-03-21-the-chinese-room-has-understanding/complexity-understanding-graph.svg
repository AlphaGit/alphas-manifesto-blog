<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" viewBox="0 0 720 430"><rect width="720" height="430" fill="#f8f8f8" rx="8"/><text x="360" y="30" fill="#4a3f35" font-size="14" font-weight="bold" text-anchor="middle">What would the rulebook actually need?</text><text x="120" y="62" fill="#4a3f35" font-size="11" font-weight="bold" text-anchor="middle">All possible Chinese</text><text x="120" y="76" fill="#4a3f35" font-size="11" font-weight="bold" text-anchor="middle">conversations</text><ellipse cx="120" cy="130" fill="#e8d8c8" stroke="#8b7b6f" stroke-width="1.5" rx="95" ry="42"/><text x="120" y="120" fill="#4a3f35" font-size="10" text-anchor="middle">infinite sentences</text><text x="120" y="133" fill="#4a3f35" font-size="10" text-anchor="middle">infinite contexts</text><text x="120" y="146" fill="#4a3f35" font-size="10" text-anchor="middle">infinite ambiguities</text><line x1="230" x2="310" y1="130" y2="130" stroke="#4a3f35" stroke-width="2"/><polygon fill="#4a3f35" points="310 130 300 124 300 136"/><text x="270" y="122" fill="#666" font-size="9" text-anchor="middle">must fit in a</text><text x="270" y="143" fill="#666" font-size="9" text-anchor="middle">finite book</text><rect width="370" height="70" x="325" y="55" fill="#fff" stroke="#c0392b" stroke-dasharray="5 3" stroke-width="1.5" rx="6"/><text x="340" y="76" fill="#c0392b" font-size="11" font-weight="bold">Option A: Lookup table</text><text x="340" y="93" fill="#666" font-size="10">Store every possible input → output pair.</text><text x="340" y="108" fill="#666" font-size="10">Simple rules, no understanding needed.</text><text x="680" y="80" fill="#c0392b" font-size="9" text-anchor="end">Size: ∞</text><text x="680" y="94" fill="#c0392b" font-size="9" text-anchor="end">Physically impossible.</text><rect width="370" height="70" x="325" y="140" fill="#fff" stroke="#2e7d32" stroke-width="1.5" rx="6"/><text x="340" y="161" fill="#2e7d32" font-size="11" font-weight="bold">Option B: Compressed rules</text><text x="340" y="178" fill="#666" font-size="10">Encode principles that generate correct responses.</text><text x="340" y="195" fill="#666" font-size="10">Finite book. But what must it contain?</text><text x="680" y="168" fill="#2e7d32" font-size="9" text-anchor="end">Only feasible option.</text><text x="360" y="258" fill="#4a3f35" font-size="11" font-weight="bold" text-anchor="middle">To compress infinite Chinese into finite rules,</text><text x="360" y="274" fill="#4a3f35" font-size="11" font-weight="bold" text-anchor="middle">the book must encode:</text><rect width="118" height="38" x="40" y="290" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="4"/><text x="99" y="313" fill="#2e7d32" font-size="10" text-anchor="middle">Grammar</text><rect width="118" height="38" x="170" y="290" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="4"/><text x="229" y="313" fill="#2e7d32" font-size="10" text-anchor="middle">Semantics</text><rect width="118" height="38" x="300" y="290" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="4"/><text x="359" y="313" fill="#2e7d32" font-size="10" text-anchor="middle">Context</text><rect width="118" height="38" x="430" y="290" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="4"/><text x="489" y="313" fill="#2e7d32" font-size="10" text-anchor="middle">Inference</text><rect width="130" height="38" x="560" y="290" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="4"/><text x="625" y="313" fill="#2e7d32" font-size="10" text-anchor="middle">Disambiguation</text><line x1="360" x2="360" y1="333" y2="358" stroke="#4a3f35" stroke-width="1.5"/><polygon fill="#4a3f35" points="360 363 354 353 366 353"/><rect width="560" height="50" x="80" y="370" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="6"/><text x="360" y="390" fill="#e65100" font-size="12" font-weight="bold" text-anchor="middle">Searle&apos;s sleight of hand</text><text x="360" y="408" fill="#4a3f35" font-size="11" text-anchor="middle">He describes Option B&apos;s output, but asks you to picture Option A&apos;s simplicity.</text></svg>